<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import * as CM from "/web/room/char_mixamo.js";
const R = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); R.setSize(500, 500); R.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd0d0cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555544, 1.5)); const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(1.5, 3, 2.5); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 50); let body, meshes = [];
const V = () => new THREE.Vector3();
const bn = n => body.getObjectByName(n);
window.MX = {
  async load(u) { const g = await new Promise((ok, no) => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(u, ok, undefined, no));
    body = g.scene; CM.prep(THREE, g); scene.add(body); body.traverse(o => { if (o.isSkinnedMesh) { meshes.push(o); o.frustumCulled = false; } });
    const names = []; body.traverse(o => { if (o.isBone) names.push(o.name); }); return {names, meshes: meshes.map(m => [m.name, m.geometry.attributes.position.count])}; },
  pos(n) { return bn(n).getWorldPosition(V()).toArray().map(x => +x.toFixed(3)); },
  rest() { meshes[0].skeleton.pose(); body.updateMatrixWorld(true); },
  // rotate bone n about WORLD axis [x,y,z] by deg
  rot(n, ax, deg) { const b = bn(n); if (!b) throw new Error("no bone " + n); body.updateMatrixWorld(true);
    const qw = new THREE.Quaternion().setFromAxisAngle(V().set(...ax).normalize(), THREE.MathUtils.degToRad(deg));
    const bw = b.getWorldQuaternion(new THREE.Quaternion()), pw = b.parent.getWorldQuaternion(new THREE.Quaternion());
    b.quaternion.copy(pw.invert().multiply(qw).multiply(bw)); body.updateMatrixWorld(true); },
  shot(focus, dir, r) { const t = focus ? bn(focus).getWorldPosition(V()) : V().set(0, 0.9, 0); const d = V().set(...dir).normalize();
    cam.position.copy(t).addScaledVector(d, r); cam.lookAt(t); R.render(scene, cam); return R.domElement.toDataURL("image/png"); },
};
MX.armW = () => { // vertices of the torso region (rest |x| < 0.30, y 0.85..1.25) carrying LeftArm/RightArm weight
  const out = {n: 0, w10: 0, w30: 0, minY: 9, list: []}; const v = V();
  for (const m of meshes) { if (/slides|socks/.test(m.name)) continue; const sk = m.skeleton, I = m.geometry.attributes.skinIndex, W = m.geometry.attributes.skinWeight, P = m.geometry.attributes.position;
    for (let i = 0; i < P.count; i++) { let aw = 0; for (let c = 0; c < 4; c++) { const nm = sk.bones[I.getComponent(i, c)].name; if (/^(Left|Right)(Arm|ForeArm)$/.test(nm)) aw += W.getComponent(i, c); }
      if (aw < 0.1) continue; v.fromBufferAttribute(P, i).applyMatrix4(m.bindMatrix).applyMatrix4(m.matrixWorld);
      if (Math.abs(v.x) < 0.30 && v.y > 0.85 && v.y < 1.25) { out.n++; if (aw >= 0.3) out.w30++; out.minY = Math.min(out.minY, v.y); out.list.push([m.name, i]); } } }
  return out; };
MX.disp = list => { let mx = 0, mxOut = 0; const v = V(), r = V(); for (const [mn, i] of list) { const m = meshes.find(x => x.name === mn);
    m.getVertexPosition(i, v).applyMatrix4(m.matrixWorld); r.fromBufferAttribute(m.geometry.attributes.position, i).applyMatrix4(m.bindMatrix).applyMatrix4(m.matrixWorld);
    mx = Math.max(mx, v.distanceTo(r)); mxOut = Math.max(mxOut, Math.abs(v.x) - Math.abs(r.x)); } return {maxMove_cm: +(mx * 100).toFixed(1), maxOutward_cm: +(mxOut * 100).toFixed(1)}; };
// aim(bone, child, dir): turn bone (in world) so bone->child points along dir
MX.aim = (n, c, dir) => { body.updateMatrixWorld(true); const b = bn(n), a = b.getWorldPosition(V()), d0 = bn(c).getWorldPosition(V()).sub(a).normalize();
  const qw = new THREE.Quaternion().setFromUnitVectors(d0, V().set(...dir).normalize());
  const bw = b.getWorldQuaternion(new THREE.Quaternion()), pw = b.parent.getWorldQuaternion(new THREE.Quaternion());
  b.quaternion.copy(pw.invert().multiply(qw).multiply(bw)); body.updateMatrixWorld(true); };
MX.POSES = {
  down: [["LeftArm", "LeftForeArm", [0.454, -0.891, 0]], ["RightArm", "RightForeArm", [-0.454, -0.891, 0]], ["LeftForeArm", "LeftHand", [0.40, -0.92, 0.05]], ["RightForeArm", "RightHand", [-0.40, -0.92, 0.05]]],
  T: [["LeftArm", "LeftForeArm", [1, 0, 0]], ["RightArm", "RightForeArm", [-1, 0, 0]], ["LeftForeArm", "LeftHand", [1, 0, 0]], ["RightForeArm", "RightHand", [-1, 0, 0]]],
  typing: [["LeftArm", "LeftForeArm", [0.25, -0.85, 0.45]], ["RightArm", "RightForeArm", [-0.25, -0.85, 0.45]], ["LeftForeArm", "LeftHand", [-0.25, 0.05, 1]], ["RightForeArm", "RightHand", [0.25, 0.05, 1]]],
  up: [["LeftArm", "LeftForeArm", [0.766, 0.643, 0]], ["RightArm", "RightForeArm", [-0.766, 0.643, 0]], ["LeftForeArm", "LeftHand", [0.766, 0.643, 0]], ["RightForeArm", "RightHand", [-0.766, 0.643, 0]]],
  side: [["LeftArm", "LeftForeArm", [0.05, -1, 0.1]], ["RightArm", "RightForeArm", [-0.05, -1, 0.1]], ["LeftForeArm", "LeftHand", [0.05, -1, 0.15]], ["RightForeArm", "RightHand", [-0.05, -1, 0.15]]],
};
MX.pose = k => { MX.rest(); for (const [n, c, d] of MX.POSES[k]) MX.aim(n, c, d); };
// torso vertices (dominant bone Spine*/Hips/neck, not the slides) in their world positions
MX.torso = () => { const out = []; const v = V(); for (const m of meshes) { if (/slides|socks/.test(m.name)) continue; const sk = m.skeleton, I = m.geometry.attributes.skinIndex, W = m.geometry.attributes.skinWeight, P = m.geometry.attributes.position;
  for (let i = 0; i < P.count; i += 2) { let b = 0; for (let c = 1; c < 4; c++) if (W.getComponent(i, c) > W.getComponent(i, b)) b = c; if (!/^(Spine|Spine0[12]|Hips)$/.test(sk.bones[I.getComponent(i, b)].name)) continue;
    m.getVertexPosition(i, v).applyMatrix4(m.matrixWorld); out.push([m.name, i, v.x, v.y, v.z]); } } return out; };
MX.moved = ref => { const v = V(); let n3 = 0, n6 = 0, mx = 0, low = 9; for (const [mn, i, x, y, z] of ref) { const m = meshes.find(q => q.name === mn); m.getVertexPosition(i, v).applyMatrix4(m.matrixWorld);
  const d = Math.hypot(v.x - x, v.y - y, v.z - z); if (d > 0.03) { n3++; if (y < low) low = y; } if (d > 0.06) n6++; mx = Math.max(mx, d); } return {torsoVerts: ref.length, moved_over_3cm: n3, moved_over_6cm: n6, max_cm: +(mx * 100).toFixed(1), lowest_moved_over_3cm_y: +low.toFixed(2)}; };
window.READY = true;
