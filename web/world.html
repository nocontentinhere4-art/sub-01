<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUB-01 · what it sees</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="What the brain model sees: one view at a time, rendered from its state and from chat messages.">
<link rel="canonical" href="/world.html">
<link rel="stylesheet" href="/ui.css">
<style>
  /* SUB-01 · 05 sees: a single-frame viewer. The frame is the page; a 56 px filmstrip under it (newest at the right);
     ← → move one frame, Home / End jump (body[data-keys]: deck.js leaves the arrows to the page, [ ] still change pages).
     Tokens, header, .ui-title, .ui-caption, .ui-chip come from /ui.css (v2). */
  :root { --gut:clamp(16px, 2.4vw, 32px); --strip:56px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:#000; color:var(--ui-fg); }
  body { font-family:var(--ui-sans); -webkit-font-smoothing:antialiased; overflow-x:hidden;
    height:100vh; height:100dvh; display:flex; flex-direction:column; }
  button { font:inherit; }
  #hdr { flex:none; border-bottom:1px solid var(--ui-line); }

  main { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

  /* the frame: no panel; the image floats on the black page at the available height (contain), and the overlays sit
     on the image's drawn box (#box, measured from naturalWidth/Height, see fit()) */
  #stage { flex:1 1 auto; min-height:0; display:flex; padding:14px var(--gut) 10px; }
  #panel { position:relative; flex:1; min-width:0; margin:0; }
  /* a mild lift for very dark frames, on the viewer image only (not the filmstrip) */
  #panel img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity 1.2s var(--ui-ease); filter:brightness(1.15) contrast(1.05); }
  #panel img.on { opacity:1; }
  #box { position:absolute; left:0; top:0; width:0; height:0; z-index:1; pointer-events:none; overflow:hidden; }
  .ov { position:absolute; left:14px; right:14px; z-index:1; pointer-events:none; font-family:var(--ui-mono); }
  #ov-top { top:14px; display:flex; flex-direction:column; gap:7px; }
  #cap { display:flex; align-items:center; gap:10px; }
  #cap .ui-caption { color:var(--ui-fg); text-shadow:0 0 6px #000; }
  #now-chip { background:#fff; color:#000; border-color:#fff; padding:1px 7px; font-size:12px; }
  #objs { font-size:12px; line-height:1.45; letter-spacing:.04em; color:var(--ui-fg2); text-shadow:0 0 6px #000;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #objs { pointer-events:auto; }
  #objs:empty { display:none; }
  #line { bottom:14px; font-size:12px; line-height:1.4; color:var(--ui-fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 6px #000; }
  #line:empty { display:none; }
  #box::after { content:""; position:absolute; left:0; right:0; bottom:0; height:64px; pointer-events:none;
    background:linear-gradient(transparent, rgba(0,0,0,.55)); }

  /* the filmstrip: tiny square tiles, 1 px seams, newest at the right */
  #film { flex:none; position:relative; padding:0 var(--gut) 8px; }
  #strip { display:flex; gap:1px; height:var(--strip); overflow-x:auto; overflow-y:hidden; scrollbar-width:none; overscroll-behavior-x:contain; }
  #strip::-webkit-scrollbar { display:none; }
  #strip button { flex:none; position:relative; width:var(--strip); height:var(--strip); padding:0; border:0; background:#0a0a0c; cursor:pointer;
    opacity:.55; transition:opacity .2s var(--ui-ease); }
  #strip button:first-child { margin-left:auto; }                 /* a short strip sits at the right, by the newest */
  #strip button:hover { opacity:.9; }
  #strip button img { width:100%; height:100%; object-fit:cover; display:block; }
  #strip button.on { opacity:1; outline:2px solid #fff; outline-offset:-2px; z-index:1; }
  #strip button:focus-visible { outline:1px solid #fff; outline-offset:-1px; opacity:1; }
  #newpill { position:absolute; right:calc(var(--gut) + 8px); top:50%; transform:translateY(calc(-50% - 4px)); z-index:2; }
  #newpill .ui-dot { color:var(--ui-live); }

  .sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .kick { flex:none; margin:0; padding:12px var(--gut) 0; }
  /* the empty state: a small block, and the faint blue fibre plate behind it so the page is never an empty slide */
  #empty { flex:1; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:12px;
    padding:clamp(28px, 7vh, 72px) var(--gut) 40px; }
  #empty::before { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; opacity:.12;
    background:url(/intro_brain_top.webp) 50% 50% / min(78vmin, 720px) auto no-repeat;
    -webkit-mask-image:radial-gradient(closest-side at 50% 50%, #000 35%, transparent 100%); mask-image:radial-gradient(closest-side at 50% 50%, #000 35%, transparent 100%);
    -webkit-mask-size:min(78vmin, 720px) min(78vmin, 720px); mask-size:min(78vmin, 720px) min(78vmin, 720px);
    -webkit-mask-position:50% 50%; mask-position:50% 50%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  #empty p.live-line { max-width:none; font-family:var(--ui-mono); font-size:12px; letter-spacing:-.01em; text-transform:none; color:var(--ui-dim); }
  #empty p { margin:0; max-width:34em; font-family:var(--ui-sans); font-size:16px; line-height:1.5; letter-spacing:0; text-transform:none; color:var(--ui-fg2); }

  /* the honesty line: one short sentence above the pulse */
  #note { flex:none; margin:0; padding:6px var(--gut) 8px; font-size:12px; border-top:1px solid var(--ui-line); }

  @media (max-width:720px) {
    #stage { padding:0; }
    .ov { left:12px; right:12px; }
    #film { padding:8px 0 6px; }
    #newpill { right:8px; }
  }
  @media (prefers-reduced-motion:reduce) {
    #panel img, #strip button { transition:none; }
  }
</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="SUB-01"><meta property="og:title" content="SUB-01 · what it sees"><meta property="og:description" content="One frame at a time: scenes rendered from the brain model's state and from chat messages."><meta property="og:image" content="/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="SUB-01 · what it sees"><meta name="twitter:description" content="One frame at a time: scenes rendered from the brain model's state and from chat messages."><meta name="twitter:image" content="/og.jpg">
</head>
<body data-deck="05" data-pulse data-keys>
<header class="ui-hdr" id="hdr">
  <a class="ui-lockup" href="/"><b>SUB-01</b><small>brain model</small></a>
  <nav class="ui-nav" aria-label="pages"><a href="/">live</a><a href="/brain">brain</a><a href="/room">room</a><a href="/diary">diary</a><a href="/world.html">sees</a><a href="/about.html">about</a></nav>
  <div class="ui-spacer"></div>
  <div class="ui-state">
    <span class="ui-chip live" id="ui-live"><i class="ui-dot"></i><span id="ui-live-t">live</span></span>
    <span class="ui-clock" id="ui-clock">--:-- Tokyo</span>
  </div>
</header>

<main id="main">
  <h1 class="sr">What it sees</h1>
  <p class="ui-caption kick" id="kick" hidden>05 · SEES</p>
  <section id="empty" class="ui-in" style="--i:1" hidden>
    <span class="ui-caption">05 · SEES</span>
    <p>No pictures yet. One appears when the model renders a scene.</p>
    <p class="ui-caption live-line" id="next-frame" aria-live="off"></p>
  </section>

  <div id="stage" hidden>
    <figure id="panel" class="ui-in" style="--i:1; margin:0" aria-label="the frame on show">
      <img id="a" width="768" height="432" alt=""><img id="b" width="768" height="432" alt="">
      <div id="box">
        <div class="ov" id="ov-top">
          <div id="cap"><span class="ui-caption" id="cap-t">--:--</span><span class="ui-chip" id="now-chip" hidden>now</span></div>
          <div id="objs"></div>
        </div>
        <figcaption class="ov" id="line"></figcaption>
      </div>
    </figure>
  </div>

  <div id="film" class="ui-in" style="--i:2" hidden>
    <div id="strip" role="listbox" aria-label="frames, newest at the right (← → move, Home / End jump)"></div>
    <button class="ui-btn primary" id="newpill" type="button" hidden><i class="ui-dot"></i> new frame</button>
  </div>
</main>

<p id="note" class="ui-honest">Rendered from the brain model's state. Not anyone's dreams or thoughts. A model, not a mind.</p>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- a live line on the empty state, from the Tokyo clock alone (his usual night: 23:56 to 07:54, docs/twin/sleep.md) ----
const tokyoHM = new Intl.DateTimeFormat("en-GB", {hour:"2-digit", minute:"2-digit", hourCycle:"h23", timeZone:"Asia/Tokyo"});
function tokyoMin(){ const p = Object.fromEntries(tokyoHM.formatToParts(new Date()).map(x => [x.type, x.value])); return { m:(+p.hour) * 60 + (+p.minute), hm:`${p.hour}:${p.minute}` }; }
const BED = 23 * 60 + 56, WAKE = 7 * 60 + 54;
const asleepAt = m => m >= BED || m < WAKE;
function nextFrame(){
  const el = $("next-frame"), t = tokyoMin(), up = !asleepAt(t.m);
  el.textContent = up ? `Next frame: while he is awake, about every 90 s \u00b7 ${t.hm} Tokyo \u00b7 awake now`
                      : `Next frame: while he sleeps, less often \u00b7 ${t.hm} Tokyo \u00b7 asleep now`;
}
nextFrame(); setInterval(nextFrame, 60000);

let frames = [], at = -1, front = "a", world = [], resting = null;

// the overlays follow the image's drawn box (object-fit: contain inside #panel)
function fit(){
  const img = $(front), p = $("panel"), box = $("box");
  const W = p.clientWidth, H = p.clientHeight, nw = img.naturalWidth, nh = img.naturalHeight;
  if (!nw || !nh || !W || !H) return;
  const k = Math.min(W / nw, H / nh), w = nw * k, h = nh * k;
  box.style.cssText = `left:${(W - w) / 2}px; top:${(H - h) / 2}px; width:${w}px; height:${h}px`;
}
if ("ResizeObserver" in window) new ResizeObserver(fit).observe($("panel")); else addEventListener("resize", fit);

const isRem = st => String(st || "").toUpperCase() === "REM";
const stageName = (st, gloss) => isRem(st) ? (gloss ? "DREAM SLEEP (REM)" : "dream sleep") : String(st || "").toUpperCase();   // (the gloss once, on the first such frame)
function paint(i, smooth){
  if (!frames.length) return;
  at = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[at], latest = at === frames.length - 1;
  const back = front === "a" ? "b" : "a", img = $(back);
  if ($(front).getAttribute("src") !== f.img) {
    img.onload = () => { img.classList.add("on"); $(front).classList.remove("on"); front = back; fit(); };
    img.src = f.img;
  }
  $("cap-t").textContent = `${f.t || "--:--"} · ${stageName(f.stage, at === frames.findIndex(x => isRem(x.stage)))}${latest && resting ? ` · ${resting}` : ""}`;
  $("now-chip").hidden = !latest;
  const wl = latest ? world.slice(0, 4) : [];                          // the names on the picture, the scores on hover
  $("objs").textContent = wl.length ? "in its world · " + wl.map(o => o.name).join(" · ") : "";
  $("objs").title = wl.map(o => `${o.name} ${o.strength}`).join(" · ");
  $("line").textContent = f.thought ? `“${f.thought}”` : "";
  const w = f.why || {}, bits = [];                    // where the line came from: on hover, never a paragraph
  if (w.messages && w.messages.length) bits.push("from chat: " + w.messages.slice(-2).map(x => `“${String(x).slice(0, 60)}”`).join(", "));
  if (w.replayed && w.replayed.length) bits.push("playing again: " + w.replayed.slice(-2).map(x => `“${String(x).slice(0, 60)}”`).join(", "));
  $("panel").title = bits.join(" · ");
  const tiles = $("strip").children;
  for (let k = 0; k < tiles.length; k++) { const on = k === at; tiles[k].classList.toggle("on", on); tiles[k].setAttribute("aria-selected", String(on)); }
  if (tiles[at]) tiles[at].scrollIntoView({block:"nearest", inline:"nearest", behavior:smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth" : "auto"});
  if (latest) $("newpill").hidden = true;
}

async function refresh(follow){
  let d;
  try { d = await (await fetch("/api/frames?n=48")).json(); } catch { return; }
  const keep = frames[at] && frames[at].img, wasLatest = at === frames.length - 1;
  const out = [];                                       // the same image kept for a new line is one frame: its latest line
  (d.frames || []).forEach(f => { if (out.length && out[out.length - 1].img === f.img) out[out.length - 1] = f; else out.push(f); });
  frames = out; world = d.world || []; resting = d.resting || null;
  const none = !frames.length;
  $("empty").hidden = !none; $("kick").hidden = none; $("stage").hidden = none; $("film").hidden = none;
  if (none) return;
  $("strip").innerHTML = frames.map((f, k) => `<button type="button" role="option" data-k="${k}" title="${esc(f.t)} · ${esc(stageName(f.stage))}" aria-label="${esc(f.t)} ${esc(stageName(f.stage))}"><img src="${esc(f.img)}" width="56" height="56" loading="lazy" decoding="async" alt=""></button>`).join("");
  let to = frames.length - 1;
  if (!follow && !wasLatest && keep) { const k = frames.findIndex(f => f.img === keep); if (k >= 0) to = k; }
  if (follow === false && !wasLatest) $("newpill").hidden = false;
  paint(to, false);
}

$("strip").addEventListener("click", e => { const b = e.target.closest("button"); if (b) paint(+b.dataset.k, true); });
$("newpill").onclick = () => paint(frames.length - 1, true);
document.addEventListener("keydown", e => {
  if (!frames.length || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.isComposing) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  const k = e.key;
  const to = k === "ArrowLeft" ? at - 1 : k === "ArrowRight" ? at + 1 : k === "Home" ? 0 : k === "End" ? frames.length - 1 : null;
  if (to === null) return;
  e.preventDefault();
  paint(to, true);
});

// a new frame on the socket ("eye"): it crossfades in only if the viewer is on the latest; else a "new frame" pill
let backoff = 1000;
function connect(){
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws?rate=1&lite=1`);
  ws.onopen = () => { backoff = 1000; };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "eye") refresh(!frames.length || at === frames.length - 1 ? true : false); };
  ws.onclose = () => { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 30000); };
}
refresh(true); connect();
</script>
<script src="/deck.js" defer></script><script src="/pulse.js" defer></script>
</body>
</html>
