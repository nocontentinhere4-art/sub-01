<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUB-01 · world</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#040406; --fg:#ececf2; --dim:#7a7a8c; --or:#ff6a00; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:14px; padding:18px 28px 14px; }
  header h1 { margin:0; font-size:20px; letter-spacing:.16em; background:var(--or); color:#0a0a0a; padding:3px 10px 2px; border-radius:2px; }
  header .sub { color:var(--dim); font-size:12px; }
  header .sub a { text-decoration:none; padding:4px 6px; border-radius:4px; transition:color .2s, background .2s; }
  header .sub a:hover { color:var(--fg); background:rgba(255,255,255,.06); }
  #stage { color:var(--or); }
  main { display:grid; grid-template-columns: 1fr 320px; gap:24px; padding:0 28px 18px; }
  #view { position:relative; width:100%; aspect-ratio:16/9; background:radial-gradient(ellipse at 50% 60%, #15151d, #040406); border:1px solid #1c1c26;
    border-radius:10px; overflow:hidden; box-shadow:0 20px 50px -24px #000; }
  #view img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 3s ease; }
  #view img.on { opacity:1; }
  #thought { position:absolute; left:0; right:0; bottom:0; padding:22px 26px; font-size:22px; font-style:italic;
    background:linear-gradient(transparent, rgba(0,0,0,.8)); text-shadow:0 1px 8px #000; }
  #why { color:var(--dim); font-size:12px; margin-top:8px; min-height:2.4em; }
  aside .lbl { color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin:4px 0 8px; }
  #world div { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; border-bottom:1px solid #111118; }
  #world span:last-child { color:var(--dim); }
  #strip { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:10px; padding:0 28px 18px; }
  #strip figure { margin:0; font-size:11px; color:var(--dim); line-height:1.4; }
  #strip img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:6px; border:1px solid #1c1c26; margin-bottom:4px; transition:border-color .2s; }
  #strip figure:hover img { border-color:#3a3a4a; }
  #strip figure, #view { cursor:zoom-in; }
  /* the lightbox: any image full screen (a viewer could not open them: clicks did nothing); arrows, Esc, a click outside */
  #lb { position:fixed; inset:0; z-index:20; background:rgba(2,2,4,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; cursor:zoom-out; }
  #lb[hidden] { display:none; }
  #lb img { max-width:100%; max-height:calc(100vh - 110px); object-fit:contain; border-radius:8px; box-shadow:0 30px 80px -30px #000; cursor:default; }
  #lb figcaption { margin-top:12px; font-size:13px; color:#c6c6d4; text-align:center; max-width:90ch; line-height:1.5; }
  #lb figcaption i { font-style:italic; color:var(--fg); }
  #lb button { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:0; background:rgba(255,255,255,.06); color:var(--fg); font:inherit; font-size:22px; border-radius:8px; cursor:pointer; }
  #lb button:hover { background:rgba(255,255,255,.14); } #lb button[disabled] { opacity:.25; cursor:default; }
  #lb-prev { left:10px; } #lb-next { right:10px; }
  #lb #lb-x { top:10px; right:10px; transform:none; width:40px; height:40px; font-size:18px; }   /* (outranks the arrows' rule) */
  #lb-n { position:absolute; top:18px; left:16px; font-size:12px; color:var(--dim); }
  #note { color:#55556a; font-size:11px; padding:0 28px 18px; max-width:90ch; line-height:1.5; }
  @media (max-width: 800px) { header, main, #strip, #note { padding-left:16px; padding-right:16px; }
    main { grid-template-columns: 1fr; } #thought { font-size:16px; } }
</style>
</head>
<body>
<header><h1>SUB-01</h1><div class="sub">the simulated world · <span id="stage">…</span> · <a href="/" style="color:inherit">room</a> · <a href="/brain" style="color:inherit">brain</a> · <a href="/diary" style="color:inherit">dream diary</a> · <a href="https://city.subzerone.live/" style="color:inherit" target="_blank" rel="noopener">city</a></div></header>
<main>
  <div>
    <div id="view"><img id="a" alt=""><img id="b" alt=""><div id="thought"></div></div>
    <div id="why"></div>
  </div>
  <aside>
    <div class="lbl">In its world now</div><div id="world"></div>
  </aside>
</main>
<div class="lbl" style="padding:0 28px;color:#7a7a8c;font-size:11px;letter-spacing:.1em">EARLIER</div>
<div id="strip"></div>
<div id="note">Images and thoughts are generated by AI from the brain model's state and from chat messages. They are not what the real person saw or thought. It is not a mind.</div>
<figure id="lb" hidden role="dialog" aria-modal="true" aria-label="image, full screen"><span id="lb-n"></span><button id="lb-x" type="button" title="close (Esc)">✕</button><button id="lb-prev" type="button" title="earlier (←)">‹</button><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption><button id="lb-next" type="button" title="later (→)">›</button></figure>
<script>
let front = "a";
// ---- the lightbox: the frames in time order (oldest first), the one on show, arrows and keys ----
let frames = [], lbAt = -1;
const $ = id => document.getElementById(id);
function lbShow(i){
  if (!frames.length) return;
  lbAt = Math.max(0, Math.min(frames.length - 1, i));
  const f = frames[lbAt], cap = $("lb-cap");
  $("lb-img").src = f.img;
  cap.textContent = ""; const t = document.createElement("span"); t.textContent = `${f.t} ${f.stage || ""} · `; cap.append(t);
  if (f.thought) { const q = document.createElement("i"); q.textContent = `“${f.thought}”`; cap.append(q); }
  $("lb-n").textContent = `${lbAt + 1} / ${frames.length}`;
  $("lb-prev").disabled = lbAt === 0; $("lb-next").disabled = lbAt === frames.length - 1;
  $("lb").hidden = false; document.body.style.overflow = "hidden";
}
function lbClose(){ $("lb").hidden = true; document.body.style.overflow = ""; }
$("lb").addEventListener("click", e => { if (e.target === e.currentTarget || e.target.id === "lb-cap") lbClose(); });
$("lb-x").onclick = lbClose;
$("lb-prev").onclick = () => lbShow(lbAt - 1);
$("lb-next").onclick = () => lbShow(lbAt + 1);
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") lbClose(); else if (e.key === "ArrowLeft") lbShow(lbAt - 1); else if (e.key === "ArrowRight") lbShow(lbAt + 1);
});
$("view").addEventListener("click", () => lbShow(frames.length - 1));                   // the big one: the newest frame
$("strip").addEventListener("click", e => { const fig = e.target.closest("figure"); if (fig) lbShow(+fig.dataset.i); });
function show(f){
  const back = front === "a" ? "b" : "a", img = document.getElementById(back);
  img.onload = () => { img.classList.add("on"); document.getElementById(front).classList.remove("on"); front = back; };
  img.src = f.img;
  document.getElementById("stage").textContent = `${f.stage} ${f.t}${f.resting ? " · " + f.resting : ""}`;
  document.getElementById("thought").textContent = f.thought ? `“${f.thought}”` : "";
  const w = f.why || {}, bits = [];
  if (w.messages && w.messages.length) bits.push("from chat: " + w.messages.slice(-2).map(x => `“${x.slice(0, 60)}”`).join(", "));
  if (w.replayed && w.replayed.length) bits.push("dreaming of: " + w.replayed.slice(-2).map(x => `“${x.slice(0, 60)}”`).join(", "));
  // (no market line: the coin's trades are a stimulus inside the model, never a word on the page)
  document.getElementById("why").textContent = bits.join(" · ");
}
async function refresh(){
  const d = await (await fetch("/api/frames?n=24")).json();
  document.getElementById("world").innerHTML = d.world.length
    ? d.world.map(o => `<div><span>${o.name.replace(/</g, "")}</span><span>${o.strength}</span></div>`).join("")
    : `<div><span style="color:#55556a">empty — write something in the chat</span></div>`;
  frames = d.frames;                                                                   // (oldest first; data-i = index)
  document.getElementById("strip").innerHTML = d.frames.slice(0, -1).map((f, i) =>
    `<figure data-i="${i}"><img src="${f.img}" loading="lazy" alt=""><figcaption>${f.t} ${f.stage} · ${(f.thought || "").replace(/</g, "").slice(0, 60)}</figcaption></figure>`).reverse().join("");
  if (lbAt >= 0 && !$("lb").hidden) lbShow(Math.min(lbAt, frames.length - 1));         // (a refresh while open keeps the view)
  if (d.frames.length) show({...d.frames[d.frames.length - 1], resting: d.resting});
}
function connect(){
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === "eye") { show(m); refresh(); } };
  ws.onclose = () => setTimeout(connect, 2000);
}
refresh(); connect();
</script>
</body>
</html>
