<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<link rel="icon" href="data:,">
<title>SUB-01 · life</title>
<!--
  Shell for the life page. The 3D world and every panel are filled by ES modules under /world/ (entry: /world/main.js).
  three.js is vendored under /vendor/three/ and loaded through the importmap below (no CDN).

  HUD containers (stable ids; each stream fills its own, see docs/real-world/CONTRACT.md):
    #scene          canvas host (main.js). Children with class .ov are overlays on top of the canvas.
    #hud            the whole HUD layer (scene + side panel).
    #status         top-left: title, nav, #doing (what it is doing), #meta (clock / sleep stage)   (hud.js)
    #speech         under #status: inner-speech line + what it "sees" (eye thought)               (hud.js)
    #tools          top-right bar holding #lab and #quality
    #lab            lab-mode toggle + follow-camera toggle                                          (main.js)
    #quality        quality switch auto / low / medium / high                                       (quality.js)
    #phone-overlay  bottom-left phone screen while it uses the phone; main.js mounts phone.overlayEl
                    here and adds class .on while the phone is in use                               (phone.js)
    #minibrain      bottom-right mini brain (placeholder until the hud stream's fibre brain)         (minibrain.js)
    #side           side panel (right on desktop, below the scene on phones) holding:
      #workspace    workspace / needs bars + today's log                                            (hud.js)
      #chat         chat log + send form (+ nickname)                                               (hud.js)
    #honesty        honesty line, always visible (fixed to the viewport bottom). Never remove or hide it.
  Body classes set by main.js: .ready (first frame drawn), .lab, .q-low|.q-medium|.q-high, .cam-<name> with ?cam=.
-->
<script type="importmap">
{ "imports": {
    "three": "/vendor/three/build/three.module.min.js",
    "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#050507; --fg:#ececf2; --dim:#80808f; --or:#ff6a00; --line:#1c1c26; --panel:rgba(8,8,12,.72);
          --honesty-h:40px; --side-w:340px; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  body { min-height:100svh; padding-bottom:calc(var(--honesty-h) + env(safe-area-inset-bottom)); overflow-x:hidden; }
  button, input, select { font:inherit; }

  /* ---- mobile first: scene on top, panel below (the page scrolls) ---- */
  #hud { position:relative; }
  #scene { position:relative; height:62svh; min-height:320px; overflow:hidden; background:#0a0c12; }
  #scene canvas { display:block; width:100%; height:100%; touch-action:none; }
  .ov { position:absolute; z-index:2; }
  #scene::before { content:""; position:absolute; left:0; right:0; top:0; height:150px; z-index:1; pointer-events:none;
            background:linear-gradient(rgba(5,5,7,.6), rgba(5,5,7,0)); }       /* keeps the HUD text readable on a bright sky */
  #status { left:12px; top:10px; right:12px; pointer-events:none; }
  #status h1 { margin:0; font-size:17px; letter-spacing:.12em; display:inline-block; background:var(--or); color:#0a0a0a; padding:2px 8px; }
  #nav { display:block; margin-top:5px; font-size:11px; pointer-events:auto; width:max-content; }
  #nav a { color:var(--dim); text-decoration:none; margin-right:8px; } #nav a.on { color:var(--fg); }
  #doing { margin-top:8px; font-size:14px; text-shadow:0 1px 6px #000; }
  #meta { color:#b5b5c4; font-size:11px; margin-top:3px; text-shadow:0 1px 6px #000; }
  #speech { left:12px; right:12px; top:112px; pointer-events:none; font-size:13px; font-style:italic; color:#fff;
            text-shadow:0 1px 8px #000; max-width:560px; }
  #tools { right:10px; top:10px; display:flex; align-items:flex-start; gap:4px; }
  #tools .row { display:flex; gap:4px; }
  #tools button, #tools select { background:rgba(10,10,14,.78); color:var(--fg); border:1px solid #2a2a36; font-size:10px;
            padding:4px 6px; cursor:pointer; min-height:30px; }
  #tools button.on { border-color:var(--or); color:var(--or); }
  #phone-overlay { left:10px; bottom:10px; width:100px; height:190px; display:none; }
  #phone-overlay.on { display:block; }
  #minibrain { right:10px; bottom:10px; width:40%; max-width:360px; aspect-ratio:4/3; border:1px solid #2a2a36; border-radius:8px;
            overflow:hidden; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  body.cam-brain #minibrain { width:auto; max-width:none; left:4%; right:4%; bottom:4%; }
  #side { padding:12px; display:flex; flex-direction:column; gap:14px; border-top:1px solid var(--line); }
  .lbl { color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; }
  #honesty { position:fixed; left:0; right:0; bottom:0; z-index:50; min-height:var(--honesty-h);
            padding:6px 12px calc(6px + env(safe-area-inset-bottom)); background:rgba(5,5,7,.94); border-top:1px solid var(--line);
            color:#a4a4b6; font-size:10px; line-height:1.4; text-align:center; }
  #boot { position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:12px; z-index:1; pointer-events:none; }
  body.ready #boot { display:none; }

  /* ---- wider screens: scene fills the viewport, panel on the right ---- */
  @media (min-width: 900px) {
    body { height:100vh; overflow:hidden; padding-bottom:0; }
    #hud { display:grid; grid-template-columns:1fr var(--side-w); height:calc(100vh - var(--honesty-h)); }
    #scene { height:100%; }
    #side { border-top:none; border-left:1px solid var(--line); overflow-y:auto; padding:14px; }
    #status { left:16px; top:14px; right:auto; max-width:60%; }
    #status h1 { font-size:20px; padding:2px 10px; }
    #nav { display:inline-block; font-size:12px; margin:0 0 0 10px; }
    #tools { gap:6px; }
    #tools button, #tools select { font-size:11px; padding:5px 9px; }
    #doing { font-size:15px; margin-top:10px; }
    #meta { font-size:12px; }
    #speech { left:16px; top:96px; font-size:15px; right:auto; width:min(560px, 55%); }
    #tools { right:14px; top:14px; flex-direction:row; }
    #phone-overlay { left:16px; bottom:16px; width:190px; height:360px; }
    #minibrain { right:14px; bottom:14px; width:min(34%, 380px); }
    #honesty { font-size:11px; padding-top:11px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="scene">
    <div id="boot">loading the world…</div>
    <div id="status" class="ov">
      <h1>SUB-01</h1><span id="nav"><a class="on" href="/">LIFE</a><a href="/brain">BRAIN</a><a href="/world.html">DREAMS</a></span>
      <div id="doing">connecting…</div>
      <div id="meta"></div>
    </div>
    <div id="speech" class="ov" aria-live="polite"></div>
    <div id="tools" class="ov">
      <div id="lab" class="row"></div>
      <div id="quality" class="row"></div>
    </div>
    <div id="phone-overlay" class="ov"></div>
    <div id="minibrain" class="ov"></div>
  </div>
  <div id="side">
    <div id="workspace"></div>
    <div id="chat"></div>
  </div>
</div>
<div id="honesty">Simulated brain activity built from one real person's public MRI. Messages are stimuli, not conversation. It is not a mind and it is not the person.</div>
<script type="module" src="/world/main.js"></script>
</body>
</html>
