<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUB-01 · night log</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="The night log of a brain model: one night at a time, the images rendered from its state during dream sleep, the chat messages it played again and the pages it read that day.">
<link rel="stylesheet" href="/ui.css">
<style>
  /* SUB-01 · 04 diary: one night at a time. A row of night pills under the header (← → move between nights,
     ?night=YYYY-MM-DD opens one); the night's title block on the left, ONE dream image at a time on the right with a
     56 px filmstrip (↑ ↓ or a click move frames); two short lists under both. body[data-keys]: deck.js leaves ← → to
     the page, [ ] still change pages. Tokens, header, .ui-title, .ui-seg, .ui-caption come from /ui.css (v2). */
  :root { --gut:clamp(16px, 2.6vw, 40px); --strip:56px; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:#000; color:var(--ui-fg); }
  body { font-family:var(--ui-sans); -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; }
  a { color:inherit; }
  button { font:inherit; }
  #hdr { flex:none; border-bottom:1px solid var(--ui-line); }
  main { flex:1 0 auto; display:flex; flex-direction:column; }

  /* the night pills */
  #bar { display:flex; align-items:center; gap:16px; padding:10px var(--gut); border-bottom:1px solid var(--ui-line); }
  #dates-w { flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none; }
  #dates-w::-webkit-scrollbar { display:none; }
  #dates { white-space:nowrap; }
  #dates button { white-space:nowrap; font-variant-numeric:tabular-nums; text-transform:none; }
  #dates button i { font-style:normal; color:var(--rp, #a78bfa); margin-left:5px; }
  #dates button.on i { color:#000; }
  #tally { flex:none; white-space:nowrap; }

  /* one night: [title block | the dream image + filmstrip], the two lists under both */
  #night { display:grid; grid-template-columns:minmax(260px, 34%) minmax(0, 1fr); gap:24px clamp(24px, 3.4vw, 56px);
    padding:clamp(20px, 3.4vh, 36px) var(--gut) 20px; }
  #n-head h2 { font-weight:800; font-size:clamp(64px, 8.4vw, 136px); }
  #n-head h2 > span { display:block; font-weight:600; font-size:clamp(22px, 2.3vw, 36px); letter-spacing:-.035em; line-height:1.04; margin-top:.3em; text-wrap:balance; }
  #n-head p { max-width:46ch; }
  #n-head .stage { color:var(--rp, #a78bfa); }
  #n-acts { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:20px; }
  #n-acts a.ui-btn { text-decoration:none; }
  #n-acts .ui-caption { margin-left:4px; font-variant-numeric:tabular-nums; }
  #n-head .n-entry { text-transform:none; letter-spacing:0; margin:14px 0 0; font-family:var(--ui-mono); font-size:11.5px; line-height:1.6;
    color:var(--ui-fg2); max-width:52ch; }

  #n-view { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  /* no panel: the image floats on the page at its own shape (fit() sizes it inside the column, at most the available
     height), its caption under it at its width */
  #dream { position:relative; width:100%; height:200px; margin:0; }
  /* a mild lift for very dark frames, on the viewer image only (not the filmstrip) */
  #dream img { position:absolute; left:0; top:0; width:0; height:0; opacity:0; transition:opacity .7s var(--ui-ease); filter:brightness(1.15) contrast(1.05); }
  #dream img.on { opacity:1; }
  #dream .k { position:absolute; left:12px; top:12px; z-index:1; color:var(--ui-fg); text-shadow:0 0 6px #000; }
  #dream-none { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--ui-mono); font-size:11px; color:var(--ui-faint); }
  #d-line { max-width:100%; margin:0; font-family:var(--ui-mono); font-size:12px; line-height:1.45;
    color:var(--ui-fg2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.45em; }

  /* the filmstrip: tiny square tiles, 1 px seams */
  #strip { display:flex; gap:1px; height:var(--strip); max-width:100%; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; overscroll-behavior-x:contain; }
  #strip::-webkit-scrollbar { display:none; }
  #strip button { flex:none; width:var(--strip); height:var(--strip); padding:0; border:0; background:#0a0a0c; cursor:pointer; opacity:.55;
    transition:opacity .2s var(--ui-ease); }
  #strip button:hover { opacity:.9; }
  #strip button img { width:100%; height:100%; object-fit:cover; display:block; }
  #strip button.on { opacity:1; outline:2px solid #fff; outline-offset:-2px; position:relative; z-index:1; }
  #strip button:focus-visible { outline:1px solid #fff; outline-offset:-1px; opacity:1; }

  /* two compact mono lists */
  #lists { grid-column:1 / -1; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); gap:20px clamp(24px, 3.4vw, 56px); }
  .lst .ui-caption { display:flex; justify-content:space-between; gap:10px; padding-bottom:7px; border-bottom:1px solid var(--ui-line); }
  .lst ol { list-style:none; margin:0; padding:0; font-family:var(--ui-mono); font-size:11.5px; line-height:1.4; }
  .lst li { display:grid; grid-template-columns:5.2ch minmax(0, 1fr); gap:12px; padding:6px 0; border-bottom:1px solid var(--ui-line); color:var(--ui-fg2); }
  .lst li .tm { color:var(--ui-dim); font-variant-numeric:tabular-nums; }
  .lst li .tx { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lst li.top .tx { color:var(--ui-fg); }
  #l-read li { grid-template-columns:4ch 9ch minmax(0, 1fr); }
  #l-read li .n { color:var(--ui-proj); font-variant-numeric:tabular-nums; }
  #l-read li.no .n, #l-read li.no .tx { color:var(--ui-dim); }
  #l-read li .vb { color:var(--ui-dim); }
  #l-read li a { text-decoration:none; border-bottom:1px solid var(--ui-line2); }
  #l-read li a:hover { border-color:var(--ui-fg); color:var(--ui-fg); }
  #l-read li .ago { color:var(--ui-faint); }
  .lst .none { display:block; padding:8px 0; font-family:var(--ui-mono); font-size:11px; color:var(--ui-faint); }
  .lst .more { margin-top:8px; }

  .sr { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .kick { margin:0; padding:14px var(--gut) 0; }
  /* the empty state: a small block, and the faint blue fibre plate behind it so the page is never an empty slide */
  #empty { flex:1 1 auto; position:relative; isolation:isolate; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:12px;
    padding:clamp(28px, 7vh, 72px) var(--gut) 40px; }
  #empty::before { content:""; position:absolute; z-index:-1; inset:0; pointer-events:none; opacity:.12;
    background:url(/intro_brain_top.webp) 50% 50% / min(78vmin, 720px) auto no-repeat;
    -webkit-mask-image:radial-gradient(closest-side at 50% 50%, #000 35%, transparent 100%) ; mask-image:radial-gradient(closest-side at 50% 50%, #000 35%, transparent 100%);
    -webkit-mask-size:min(78vmin, 720px) min(78vmin, 720px); mask-size:min(78vmin, 720px) min(78vmin, 720px);
    -webkit-mask-position:50% 50%; mask-position:50% 50%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  #empty p { margin:0; max-width:34em; font-family:var(--ui-sans); font-size:16px; line-height:1.5; letter-spacing:0; text-transform:none; color:var(--ui-fg2); }
  /* the honesty line: one short sentence above the pulse */
  #note { flex:none; margin:0; padding:6px var(--gut) 8px; font-size:12px; border-top:1px solid var(--ui-line); }

  @media (max-width:1000px) {
    #lists { grid-template-columns:minmax(0, 1fr); }
  }
  @media (max-width:720px) {
    #bar { padding:8px var(--gut); }
    #tally { display:none; }
    #night { grid-template-columns:minmax(0, 1fr); gap:20px; }
    #n-head h2 { font-size:clamp(64px, 21vw, 96px); }
    #n-head h2 > span { font-size:clamp(22px, 6.4vw, 30px); }
  }
  @media (prefers-reduced-motion:reduce) {
    #dream img, #strip button { transition:none; }
  }
</style>
<meta property="og:type" content="website"><meta property="og:site_name" content="SUB-01"><meta property="og:title" content="SUB-01 · dream diary"><meta property="og:description" content="One night at a time: what the brain model replayed in dream sleep and the images rendered from its state."><meta property="og:image" content="/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="SUB-01 · dream diary"><meta name="twitter:description" content="One night at a time: what the brain model replayed in dream sleep and the images rendered from its state."><meta name="twitter:image" content="/og.jpg">
</head>
<body data-deck="04" data-pulse data-keys>
<header class="ui-hdr" id="hdr">
  <a class="ui-lockup" href="/"><b>SUB-01</b><small>brain model</small></a>
  <nav class="ui-nav" aria-label="pages"><a href="/">live</a><a href="/brain">brain</a><a href="/room">room</a><a href="/diary">diary</a><a href="/world.html">sees</a><a href="/about.html">about</a></nav>
  <div class="ui-spacer"></div>
  <div class="ui-state">
    <span class="ui-chip live" id="ui-live"><i class="ui-dot"></i><span id="ui-live-t">live</span></span>
    <span class="ui-clock" id="ui-clock">--:-- Tokyo</span>
    <span class="ui-counter" id="ui-counter">04 / 06</span>
  </div>
</header>

<main id="log" aria-label="night log">
  <h1 class="sr">Diary</h1>
  <p class="ui-caption kick" id="kick" hidden>04 · DIARY</p>
  <div id="bar" hidden>
    <div id="dates-w"><div class="ui-seg" id="dates" role="tablist" aria-label="nights (← → move)"></div></div>
    <span class="ui-caption" id="tally"></span>
  </div>

  <section id="empty" class="ui-in" style="--i:1" hidden>
    <span class="ui-caption">04 · DIARY</span>
    <p>No dream diary yet. He writes it after he sleeps, around 08:00 Tokyo.</p>
  </section>

  <article id="night" hidden>
    <div id="n-head" class="ui-title ui-in" style="--i:1">
      <h2><b id="n-day" style="font-weight:inherit"></b><span id="n-title"></span></h2>
      <p id="n-sub"></p>
      <div id="n-acts"></div>
      <p class="n-entry" id="n-entry" hidden></p>
    </div>
    <div id="n-view" class="ui-in" style="--i:2">
      <figure id="dream" aria-label="the dream image on show">
        <span class="ui-caption k" id="d-k"></span><img id="a" alt=""><img id="b" alt=""><div id="dream-none" hidden>no image rendered this night</div>
      </figure>
      <p id="d-line"></p>
      <div id="strip" role="listbox" aria-label="the night's frames (↑ ↓ move)"></div>
    </div>
    <div id="lists" class="ui-in" style="--i:3">
      <section class="lst" id="l-rep"></section>
      <section class="lst" id="l-read"></section>
    </div>
  </article>
</main>

<p id="note" class="ui-honest">Rendered from the brain model's state. Not anyone's dreams or thoughts. A model, not a mind.</p>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const tokyo = new Intl.DateTimeFormat("en-GB", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Tokyo"});
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function dayParts(date){                       // "2026-11-01" → ["01 Nov", "Sunday"]
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date || "");
  if (!m) return [date || "—", ""];
  return [`${m[3]} ${MON[+m[2] - 1]}`, DAY[new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay()]];
}

let nights = [], ni = -1, night = null, fi = -1, front = "a";
const cache = new Map();
const getNight = date => {
  if (!cache.has(date)) cache.set(date, fetch(`/api/diary/${encodeURIComponent(date)}`).then(r => r.ok ? r.json() : null).catch(() => null));
  return cache.get(date);
};

// ---- the image's own shape: as wide as the column allows, at most the available height ----
function fit(img){
  img = img || $(front);
  const dr = $("dream"), nw = img.naturalWidth, nh = img.naturalHeight, W = dr.clientWidth;
  if (!nw || !nh || !W) return;
  const H = innerWidth <= 720 ? innerHeight * .62 : Math.max(260, Math.min(760, innerHeight - 380));
  const k = Math.min(W / nw, H / nh), w = Math.round(nw * k), h = Math.round(nh * k);
  img.style.width = `${w}px`; img.style.height = `${h}px`;
  dr.style.height = `${h}px`;
  $("d-line").style.width = `${Math.max(w, Math.min(W, 260))}px`;
}
addEventListener("resize", () => { fit($("a")); fit($("b")); fit(); });

// ---- one frame of the night ----
function frame(i){
  const fr = (night && night.frames) || [];
  if (!fr.length) return;
  fi = Math.max(0, Math.min(fr.length - 1, i));
  const f = fr[fi], back = front === "a" ? "b" : "a", img = $(back);
  if ($(front).getAttribute("src") !== f.img) {
    img.onload = () => { fit(img); img.classList.add("on"); $(front).classList.remove("on"); front = back; };
    img.src = f.img;
  }
  $("d-k").textContent = `${f.t} · dream sleep (REM)${f.attended ? " · watched live" : ""} · ${fi + 1} / ${fr.length}`;   // (the first mention on the page: the gloss)
  $("d-line").textContent = f.thought ? `“${f.thought}”` : "";
  $("d-line").title = f.thought || "";
  const tiles = $("strip").children;
  for (let k = 0; k < tiles.length; k++) { tiles[k].classList.toggle("on", k === fi); tiles[k].setAttribute("aria-selected", String(k === fi)); }
  if (tiles[fi]) tiles[fi].scrollIntoView({block:"nearest", inline:"nearest", behavior:reduce() ? "auto" : "smooth"});
}

// ---- one night ----
function list(items, fn, cap){
  return items.length > cap
    ? `<ol>${items.slice(0, cap).map(fn).join("")}</ol><ol hidden>${items.slice(cap).map(fn).join("")}</ol><button class="ui-btn more" type="button">all ${items.length}</button>`
    : `<ol>${items.map(fn).join("")}</ol>`;
}
function fill(d){
  night = d; fi = -1;
  const x = d.facts || {}, closed = !!d.closed, frames = d.frames || [];
  const [day, wd] = dayParts(d.date);
  $("n-day").textContent = day;
  $("n-title").textContent = !closed ? "in progress" : d.title && !/^Night of /.test(d.title) ? d.title : `${wd} night`;
  $("n-sub").innerHTML = closed
    ? [`${esc(x.sleep_onset || "--:--")} → ${esc(x.woke_up || "--:--")} Tokyo`, x.wakeups ? `woke ${x.wakeups}×` : "slept through",
       `${x.replays || 0} ${x.replays === 1 ? "message" : "messages"} played again`, x.reading_replays ? `${x.reading_replays} ${x.reading_replays === 1 ? "reading" : "readings"} played again` : "",
       plural(x.dream_frames ?? frames.length, "frame")].filter(Boolean).join(" · ")
    : `<span class="stage">asleep or not over yet</span> · ${plural(frames.length, "frame")} so far`;
  const cover = frames[Math.floor(frames.length / 2)];
  $("n-acts").innerHTML = closed ? (d.share ? `<button class="ui-btn primary" type="button" data-a="copy">copy share text</button>` : "")
    + (cover ? `<a class="ui-btn" href="${esc(cover.img)}" target="_blank" rel="noopener">image ↗</a>` : "")
    + (d.text ? `<button class="ui-btn" type="button" data-a="entry" aria-expanded="false">entry</button>` : "")
    + (d.share ? `<span class="ui-caption">${d.share.length} / 280</span>` : "") : "";
  $("n-entry").textContent = d.text || ""; $("n-entry").hidden = true;

  // the image and the strip
  $("strip").innerHTML = frames.map((f, k) => `<button type="button" role="option" data-k="${k}" title="${esc(f.t)}" aria-label="frame ${k + 1}, ${esc(f.t)}"><img src="${esc(f.img)}" loading="lazy" decoding="async" alt=""></button>`).join("");
  $("strip").hidden = frames.length < 2;
  $("dream-none").hidden = frames.length > 0; $("d-line").hidden = !frames.length;
  if (!frames.length) { $("dream").style.height = "200px"; $("a").removeAttribute("src"); $("b").removeAttribute("src"); $("a").classList.remove("on"); $("b").classList.remove("on"); $("d-k").textContent = ""; }
  else frame(0);

  // replayed messages: in the order of the frames that carried them (hh:mm text), then the most replayed without a time
  const seen = new Set(), reps = [], top = new Set(x.top_replayed || []);
  for (const f of frames) for (const r of (f.replayed || [])) if (r && !seen.has(r)) { seen.add(r); reps.push({t:f.t, text:r}); }
  for (const r of (x.top_replayed || [])) if (r && !seen.has(r)) { seen.add(r); reps.push({t:"", text:r}); }
  const repLi = r => `<li class="${top.has(r.text) ? "top" : ""}"><span class="tm">${esc(r.t || "··:··")}</span><span class="tx" title="${esc(r.text)}">${esc(r.text)}</span></li>`;
  $("l-rep").innerHTML = `<div class="ui-caption"><span>played again in dream sleep${frames.length ? "" : " (REM)"}</span><span>${reps.length}</span></div>`
    + (reps.length ? list(reps, repLi, 6) : `<span class="none">none · nobody wrote that day</span>`);
  const read = x.read || [];
  const readLi = a => `<li class="${a.replayed ? "" : "no"}"><span class="n">${a.replayed ? `×${a.replayed}` : "—"}</span><span class="vb">${esc(a.verb || "read")}</span>`
    + `<span class="tx" title="${esc(a.title)}">${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title)}${a.today === false ? ` <span class="ago">· earlier</span>` : ""}</span></li>`;
  $("l-read").innerHTML = `<div class="ui-caption"><span>read that day · played again that night</span><span>${read.length}</span></div>`
    + (!closed ? `<span class="none">written in the morning</span>` : read.length ? list(read, readLi, 6) : `<span class="none">nothing read that day</span>`);
}

async function show(i, push){
  if (!nights.length) return;
  ni = Math.max(0, Math.min(nights.length - 1, i));
  const n = nights[ni];
  const pills = $("dates").children;
  for (let k = 0; k < pills.length; k++) { const on = k === ni; pills[k].classList.toggle("on", on); pills[k].setAttribute("aria-selected", String(on)); }
  if (pills[ni]) pills[ni].scrollIntoView({block:"nearest", inline:"nearest"});
  if (push) history.replaceState(null, "", `?night=${encodeURIComponent(n.date)}`);
  const d = await getNight(n.date);
  if (nights[ni] !== n) return;                     // another night was chosen meanwhile
  $("night").hidden = false;
  if (d) fill(d);
  else { night = null; $("n-day").textContent = dayParts(n.date)[0]; $("n-title").textContent = "could not be loaded"; $("n-sub").textContent = "";
    $("n-acts").innerHTML = ""; $("strip").innerHTML = ""; $("l-rep").innerHTML = ""; $("l-read").innerHTML = ""; }
  getNight(nights[Math.min(ni + 1, nights.length - 1)].date); getNight(nights[Math.max(ni - 1, 0)].date);   // the neighbours, ahead
}

$("dates").addEventListener("click", e => { const b = e.target.closest("button"); if (b) show(+b.dataset.k, true); });
$("strip").addEventListener("click", e => { const b = e.target.closest("button"); if (b) frame(+b.dataset.k); });
$("lists").addEventListener("click", e => { const m = e.target.closest(".more"); if (m) { m.previousElementSibling.hidden = false; m.remove(); } });
$("n-acts").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || !night) return;
  if (b.dataset.a === "entry") { const en = $("n-entry"); en.hidden = !en.hidden; b.classList.toggle("on", !en.hidden); b.setAttribute("aria-expanded", String(!en.hidden)); return; }
  try { await navigator.clipboard.writeText(night.share); }
  catch { const t = document.createElement("textarea"); t.value = night.share; t.style.cssText = "position:fixed;opacity:0";
    document.body.append(t); t.select(); try { document.execCommand("copy"); } catch {} t.remove(); }
  b.textContent = "copied"; setTimeout(() => b.textContent = "copy share text", 1500);
});
document.addEventListener("keydown", e => {
  if (!nights.length || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey || e.isComposing) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  const k = e.key;
  if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); show(ni + (k === "ArrowRight" ? 1 : -1), true); }
  else if ((k === "ArrowUp" || k === "ArrowDown") && night && (night.frames || []).length) { e.preventDefault(); frame(fi + (k === "ArrowDown" ? 1 : -1)); }
});

(async () => {
  let d;
  try { d = await (await fetch("/api/diary")).json(); } catch { d = {nights: []}; }
  nights = (d.nights || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);   // oldest left, newest right
  if (!nights.length) { $("empty").hidden = false; return; }
  $("kick").hidden = false; $("bar").hidden = false;
  $("dates").innerHTML = nights.map((n, k) => `<button type="button" role="tab" data-k="${k}">${esc(dayParts(n.date)[0])}${n.closed ? "" : "<i>tonight</i>"}</button>`).join("");
  const closedN = nights.filter(n => n.closed).length;
  $("tally").textContent = plural(closedN, "night");
  const lastClosed = [...nights].reverse().find(n => n.closed);
  if (lastClosed) getNight(lastClosed.date).then(x => {
    if (x && x.closed_at) $("tally").textContent = `${plural(closedN, "night")} · last written ${tokyo.format(new Date(x.closed_at * 1000))} Tokyo`;
  });
  const want = new URLSearchParams(location.search).get("night");          // ?night=YYYY-MM-DD: that night
  const k = nights.findIndex(n => n.date === want);
  show(k >= 0 ? k : nights.length - 1, false);
})();
</script>

</body>
