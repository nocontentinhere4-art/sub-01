<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUB-01 · character test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #16171b; color: #d8d8dc; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { background: #2a2c33; color: inherit; border: 1px solid #3a3d46; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button.on { background: #4a5a8a; border-color: #6a7aaa; }
  .sep { width: 100%; height: 0; }
  #info { position: fixed; left: 8px; bottom: 8px; opacity: 0.75; white-space: pre; font: 12px/1.35 ui-monospace, monospace; pointer-events: none; }
  body.shot #ui, body.shot #info { display: none; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="info">loading…</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
// The character test page (#76): plays every clip on the new character (room/boy2*.glb) and, with ?cmp, the old one
// (room/boy*.glb) next to it. ?boy=old shows only the old one. ?clip=walk&t=1.2&pose=hand_phone&shot freezes a frame
// for screenshots (window.T drives it from a script). Not linked from the site.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { boy2Extras } from "./room/boy2.js";

const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const CMP = Q.has("cmp"), WHO = Q.get("boy") || "new", SHOT = Q.has("shot");
if (SHOT) document.body.classList.add("shot");
// the clip files, keyed by the names room.html gives them ("sit" is the clip inside the model file itself)
const CLIPS = {sit: "", sleep: "sleep", eat: "eat", hold: "text", idle: "idle", door: "door", walk: "walk"};

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2b2d33);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.25, 4.2);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.9, 0); controls.update();
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(1.5, 3.2, 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -2, right: 2, top: 2.5, bottom: -0.5, near: 0.5, far: 8}); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, new THREE.HemisphereLight(0xdde6ff, 0x3a332c, 0.6));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({color: 0x6b5a48, roughness: 0.9}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// a chair seat and a bed edge at room.html's heights, so the sitting clips can be judged against something
const seat = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.06, 0.44), new THREE.MeshStandardMaterial({color: 0x333438, roughness: 0.8}));
seat.position.set(0, 0.47, -0.32);   // top at 0.50 m, like the room's chair seat.receiveShadow = seat.castShadow = true; seat.visible = false; scene.add(seat);

// and a mattress at the room's height (top at 0.70 m) for the bed clips
const bed = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.25, 2.0), new THREE.MeshStandardMaterial({color: 0x4a5a80, roughness: 0.9}));
bed.position.set(0, 0.575, 0); bed.receiveShadow = true; bed.visible = false; scene.add(bed);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load = url => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));
const chars = [];
const g2names = ["hand_relaxed", "hand_phone", "hand_chopsticks", "hand_spoon", "hand_type", "hand_mouse"];
async function makeChar(kind, x) {
  const pre = kind === "new" ? "room/boy2" : "room/boy";
  const g = await load(pre + ".glb"), root = g.scene, bones = {};
  root.position.x = x; scene.add(root);
  const morphs = [];
  root.traverse(o => {
    if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; if (o.morphTargetDictionary) morphs.push(o);
      if (kind === "old") { o.material.emissive.setRGB(0, 0, 0); o.material.roughness = 0.78; o.material.envMapIntensity = 0.5; } else o.material.envMapIntensity = 0.5; }
    if (o.isBone) { bones[o.name] = o; o.userData.bind = [o.position.clone(), o.quaternion.clone()]; }
  });
  const c = {kind, root, bones, morphs, mixer: new THREE.AnimationMixer(root), clips: {}, actions: {}, hands: {}, current: null, hand: null};
  const sit = g.animations[0]; c.clips.sit = sit;
  await Promise.all(Object.entries(CLIPS).filter(([, f]) => f).map(async ([name, f]) => {
    try { c.clips[name] = (await load(`${pre}_${f}.glb`)).animations[0]; } catch (e) { console.warn(name, e); }
  }));
  if (kind === "new") { c.x = boy2Extras(g, c.mixer); await c.x.loadHands(load); c.hands = Object.fromEntries(g2names.map(n => [n, true])); }
  // the new motion set (boy2_motion.glb: the room's clip names)
  if (kind === "new") try { for (const a of (await load("room/boy2_motion.glb")).animations) c.clips["m:" + a.name] = a; } catch (e) {}
  for (const [n, clip] of Object.entries(c.clips)) c.actions[n] = c.mixer.clipAction(clip);
  chars.push(c); return c;
}
function play(c, name, t = null) {
  const a = c.actions[name]; if (!a) return;
  if (c.current && c.current !== a) c.current.stop();
  a.reset().play(); c.current = a; if (t != null) { c.mixer.setTime(0); a.time = t; c.mixer.update(0); }
  if (c.kind === "new") hand(c, c.handName || (name === "hold" ? "hand_phone" : name === "eat" ? "hand_spoon" : "hand_relaxed"));
}
// held things, on the hand's sockets (shown with the matching finger pose)
const PROPS = {
  hand_phone: ["socket_phone", () => { const g = new THREE.Group(), body = new THREE.Mesh(new THREE.BoxGeometry(0.078, 0.162, 0.008), new THREE.MeshStandardMaterial({color: 0x1b1c22, roughness: 0.35, metalness: 0.5}));
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.072, 0.156), new THREE.MeshBasicMaterial({color: 0x9fc3ff})); scr.position.z = 0.0042; g.add(body, scr); return g; }],
  hand_chopsticks: ["socket_chopsticks", () => { const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({color: 0xb08050, roughness: 0.6});
    for (const [x, a] of [[0, 0], [0.012, 0.06]]) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0035, 0.23, 8), m); c.position.set(x, 0.08, 0); c.rotation.z = a; g.add(c); } return g; }],
  hand_spoon: ["socket_spoon", () => { const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({color: 0xd8d8dc, roughness: 0.25, metalness: 0.9});
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.15, 0.003), m); const b = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 8), m); b.scale.set(0.8, 1.2, 0.3); b.position.y = 0.09; g.add(h, b); return g; }],
};
function hand(c, name) {
  if (!c.x) return;
  for (const [n, [sock, make]] of Object.entries(PROPS)) { const host = c.root.getObjectByName(sock); if (!host) continue;
    host.userData.prop ??= (() => { const m = make(); m.traverse(o => o.castShadow = true); m.scale.setScalar(100); host.add(m); return m; })();   // sockets are in cm
    host.userData.prop.visible = n === name; }
  c.x.pose(name, 0);
}

// ------------------------------------------------------------------ UI
let clipName = Q.get("clip") || "idle", poseName = Q.get("pose") || null, paused = SHOT;
function buildUI() {
  const ui = $("ui"); ui.innerHTML = "";
  const btn = (label, on, fn) => { const b = document.createElement("button"); b.textContent = label; b.className = on ? "on" : ""; b.onclick = fn; ui.appendChild(b); };
  const names = [...new Set(chars.flatMap(c => Object.keys(c.clips)))].filter(n => n !== "blink");
  for (const n of names) btn(n, n === clipName, () => { clipName = n; for (const c of chars) play(c, n); buildUI(); });
  ui.appendChild(Object.assign(document.createElement("div"), {className: "sep"}));
  const nc = chars.find(c => c.kind === "new");
  if (nc) for (const n of g2names) btn(n.replace("hand_", ""), nc.x.poseName === n, () => { poseName = n; nc.handName = n; hand(nc, n); buildUI(); });
  btn(paused ? "play" : "pause", paused, () => { paused = !paused; buildUI(); });
  btn("seat", seat.visible, () => { seat.visible = !seat.visible; buildUI(); });
}
const T = window.T = {
  ready: false,
  // freeze a frame: clip name, time (s; or a fraction 0..1 of the clip with frac), hand pose for the new one
  set(clip, t, pose, frac) { clipName = clip; for (const c of chars) { if (pose && c.kind === "new") c.handName = pose; play(c, clip, 0);
      const d = c.clips[clip] ? c.clips[clip].duration : 1; c.current.time = frac ? t * d : t; c.mixer.update(0); }
    render(); return chars.map(c => c.clips[clip] && c.clips[clip].duration); },
  view(x, y, z, tx, ty, tz, fov) { camera.position.set(x, y, z); controls.target.set(tx, ty, tz); if (fov) { camera.fov = fov; camera.updateProjectionMatrix(); } controls.update(); render(); },
  blink(w) { for (const c of chars) for (const m of c.morphs) m.morphTargetInfluences[m.morphTargetDictionary.blink] = w; render(); },
  eyes(yaw, pitch) { for (const c of chars) if (c.x) { c.x.look(yaw, pitch); c.x.update(0); } render(); },
  seat(v) { seat.visible = v; render(); },
  bed(v) { bed.visible = v; render(); },
  apart(dx, dz) { chars.forEach((c, i) => { const k = chars.length > 1 ? i - (chars.length - 1) / 2 : 0; c.root.position.set(k * dx, 0, k * dz); }); render(); },
  // a close look at a hand in the rest pose with a finger pose on: from the side (thumb side) or from the palm side
  hand(pose, side = "Right", from = "side") { T.rest(); const c = chars.find(c => c.kind === "new") || chars[0];
    hand(c, pose); c.mixer.update(0);
    const b = c.bones[side + "Hand"], v = b.getWorldPosition(b.position.clone()).add(new THREE.Vector3(0, -0.06, 0)), s = side === "Right" ? -1 : 1;
    const d = from === "side" ? [s * 0.42, 0.05, 0.12] : from === "palm" ? [s * 0.1, -0.05, -0.42] : [s * 0.05, 0.1, 0.42];
    T.view(v.x + d[0], v.y + d[1], v.z + d[2], v.x, v.y, v.z, 30); },
  rest() { for (const c of chars) { c.mixer.stopAllAction(); for (const b of Object.values(c.bones)) { b.position.copy(b.userData.bind[0]); b.quaternion.copy(b.userData.bind[1]); } } render(); },
  info() { return chars.map(c => { let tris = 0, mats = new Set(), tex = []; c.root.traverse(o => { if (o.isMesh) { tris += o.geometry.index.count / 3;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { mats.add(m); if (m.map) tex.push(m.map.image.width + "x" + m.map.image.height); }); } });
    return {kind: c.kind, tris, materials: mats.size, textures: tex, bones: Object.keys(c.bones).length, clips: Object.fromEntries(Object.entries(c.clips).map(([k, v]) => [k, +v.duration.toFixed(2)]))}; }); },
  chars,
};
function render() { renderer.render(scene, camera); }

const clock = new THREE.Clock();
let frames = 0, fpsT = 0, fps = 0;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1), now = clock.elapsedTime;
  if (!paused) {
    for (const c of chars) { c.mixer.update(dt); if (c.x) c.x.update(dt); }
  }
  render(); frames++;
  if (now - fpsT > 1) { fps = frames / (now - fpsT); frames = 0; fpsT = now;
    $("info").textContent = `${fps.toFixed(0)} fps · ` + T.info().map(i => `${i.kind}: ${i.tris} tris, ${i.materials} materials, ${i.textures.join(" ")}, ${i.bones} bones`).join(" · "); }
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); render(); });

(async () => {
  const kinds = CMP ? ["old", "new"] : [WHO];
  await Promise.all(kinds.map((k, i) => makeChar(k, CMP ? (i ? 0.45 : -0.45) : 0)));
  chars.sort((a, b) => a.root.position.x - b.root.position.x);
  if (poseName) chars.forEach(c => c.handName = poseName);
  for (const c of chars) play(c, clipName, Q.has("t") ? +Q.get("t") : null);
  buildUI(); T.ready = true; loop();
})().catch(e => { $("info").textContent = "failed: " + e.message; console.error(e); });
</script>
</body>
</html>
