name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # as in the Dockerfile: small matrices, BLAS threads only spin
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      # no torch and no Chromium: the spiking tests skip without torch, the browser tests skip when no browser starts
      - run: pip install -r requirements-server.txt pytest
      - run: python -m pytest -q tests/

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - run: pip install -r requirements-server.txt
      # live_server.py --demo with BROWSE=0: pages + read APIs answer 200, /ws ticks, and the CPU cost per tick
      - run: python tests/smoke_demo.py --port 8765 --data-dir "$RUNNER_TEMP/data"
        env:
          BROWSE: "0"
      # issue #21: a kill mid-write must not crash-loop the server; start once with truncated state files
      - run: python tests/smoke_demo.py --port 8766 --data-dir "$RUNNER_TEMP/torn" --torn-state --measure 3
        env:
          BROWSE: "0"
      # issue #33: the day plan (brain clone vote) and chat replies run while the tick cost is measured (60x clock)
      - run: python tests/smoke_demo.py --port 8767 --data-dir "$RUNNER_TEMP/mind" --mind --measure 40
        env:
          BROWSE: "0"
      # issue #17: a chess game at the desk is played to its end, the moves voted by a brain clone (60x clock)
      - run: python tests/smoke_demo.py --port 8768 --data-dir "$RUNNER_TEMP/chess" --youtube-chess --measure 300
        env:
          BROWSE: "0"
      # issue #68: his brain model picks tracks (keyless curated list; no Spotify keys in CI, the Web API is mocked in
      # tests/test_music.py); every pick carries the official embed URL and 3-5 options (60x clock from 20:00)
      - run: python tests/smoke_demo.py --port 8769 --data-dir "$RUNNER_TEMP/music" --music --measure 150
        env:
          BROWSE: "0"
