<!doctype html>
<html><head><meta charset="utf-8"><title>Hair preview</title>
<style>html,body{margin:0;background:#888}</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Grows the strand hair on G2's head (head_g2.json from extract_head_g2.py, in the default head's frame), renders the
// comparison sheet (front, 3/4, side, back close-ups each next to a real photo; the head 2.2 m away through
// room.html's 30-degree lens with the half-density LOD, at 1:1 pixels and as the whole frame), times the strands'
// draw, and exports hair_mh.glb in G2's frame, relative to the Head bone.
// Driven by render.mjs; window.OUT gets {sheet, glb, scalp, stats}.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { buildHair, CENTER } from "./hair_gen.js";
import { paintScalp } from "./hair_tex.js";
import { scalpMaterial, setupHair } from "./hair_material.js";
import { growStrands } from "./strands.js";
import { strandMesh } from "./hair_strands.js";

const H = await (await fetch("./head_g2.json")).json();
const tex = (cv, name) => { const t = new THREE.CanvasTexture(cv); t.flipY = false; t.name = name; t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; return t; };

const t0 = performance.now();
const hair = buildHair(THREE, H.head, {layers: []});            // the head's helpers and the painted scalp base, no cards
const grown = growStrands(THREE, hair, {count: 50000});
const msGrow = Math.round(performance.now() - t0);
const scalpCanvas = paintScalp(hair.scalpStrokes);
const scalp = new THREE.Mesh(hair.scalp, scalpMaterial(THREE, tex(scalpCanvas, "hair_scalp"))); scalp.name = "hair_scalp"; scalp.renderOrder = 1;

// ---- the GLB: in G2's frame (metres = s * this frame + t), relative to the Head bone's rest position (bones are
// world-aligned at rest, so parenting it to the Head bone at the origin fits), hairs as line segments.
{
  const {s, t} = H.map, hb = H.headBone, toG2 = g => { const q = g.clone(); const p = q.attributes.position;
    for (let i = 0; i < p.count; i++) p.setXYZ(i, s * p.getX(i) + t[0] - hb[0], s * p.getY(i) + t[1] - hb[1], s * p.getZ(i) + t[2] - hb[2]); return q; };
  var exportGroup = new THREE.Group(); exportGroup.name = "hair_mh"; exportGroup.position.set(...hb);
  exportGroup.userData = {attach: "parent to the Head bone (MakeHuman 'head') with position (0, 0, 0)", runtime: "hair_strands.js strandMesh()",
                          lod: "the first half of the strands' index range is a uniform half-density LOD", headBone: hb};
  const ls = new THREE.LineSegments(toG2(grown.lines), new THREE.LineBasicMaterial({name: "hair_strands", vertexColors: true})); ls.name = "hair_strands";
  const sc = new THREE.Mesh(toG2(hair.scalp), scalp.material); sc.name = "hair_scalp";
  exportGroup.add(sc, ls);
}
const glb = await new GLTFExporter().parseAsync(exportGroup, {binary: true});

// ---- the stand-in head (G2's, plain skin), the eyes, the scalp base and the strands
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8c8c8c);
const hg = new THREE.BufferGeometry(); hg.setAttribute("position", new THREE.Float32BufferAttribute(H.head.v, 3)); hg.setIndex(H.head.i); hg.computeVertexNormals();
scene.add(new THREE.Mesh(hg, new THREE.MeshStandardMaterial({color: 0xc49a82, roughness: 0.58})));
{ // G2's own eyeballs (MakeHuman's high-poly eyes, CC0) with their iris colours
  const eg = new THREE.BufferGeometry(); eg.setAttribute("position", new THREE.Float32BufferAttribute(H.eyes.v, 3));
  eg.setAttribute("color", new THREE.Float32BufferAttribute(H.eyes.c, 3)); eg.setIndex(H.eyes.i); eg.computeVertexNormals();
  scene.add(new THREE.Mesh(eg, new THREE.MeshStandardMaterial({vertexColors: true, roughness: 0.15})));
}
setupHair(THREE, scalp); scene.add(scalp);
const full = strandMesh(THREE, grown.lines), lod = strandMesh(THREE, grown.lines, {lod: true});
lod.material.uniforms.width.value = 0.00011;                    // half the hairs, a little thicker
scene.add(full, lod);

const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(0.9, 2.2, 1.6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.5); rim.position.set(-1.2, 1.4, -1.6); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a625c, 0.35));
for (const m of [full, lod]){ const u = m.material.uniforms; u.keyDir.value.copy(key.position).normalize(); u.rimDir.value.copy(rim.position).normalize(); }

const T = new THREE.Vector3(CENTER[0], CENTER[1] + 0.005, CENTER[2]);
function shot(az, el, dist, fov, w, h, useLod){
  full.visible = !useLod; lod.visible = !!useLod;
  renderer.setSize(w, h, false);
  const cam = new THREE.PerspectiveCamera(fov, w / h, 0.02, 50), a = az * Math.PI / 180, e = el * Math.PI / 180;
  cam.position.set(T.x + Math.sin(a) * Math.cos(e) * dist, T.y + Math.sin(e) * dist, T.z + Math.cos(a) * Math.cos(e) * dist);
  cam.lookAt(T); renderer.render(scene, cam);
  // Alpha-to-coverage leaves the hairs' alpha (< 1) in the drawing buffer; copied onto the sheet those pixels would
  // let the sheet's grey through. The room draws to an opaque canvas; here alpha is reset.
  { const gl = renderer.getContext(); gl.colorMask(false, false, false, true); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.colorMask(true, true, true, true); renderer.resetState(); }
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(renderer.domElement, 0, 0); return {c, cam};
}
// The strands' draw time (software GL here: an upper bound, a real GPU is far faster): the same frame with and
// without them, each drawn 3 times and finished with a read-back.
function timeDraw(cam, useLod, w, h){
  renderer.setSize(w, h, false); const gl = renderer.getContext(), px = new Uint8Array(4);
  const once = withHair => { full.visible = withHair && !useLod; lod.visible = withHair && useLod;
    const a = performance.now(); for (let i = 0; i < 3; i++){ renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } return (performance.now() - a) / 3; };
  once(true); const without = once(false), withH = once(true);
  return Math.round(withH - without);
}

// ---- the comparison sheet: each close-up next to a real photo of short black hair at about the same angle
// (ref/*.jpg, cropped to the hair above the brows; sources and licences in README.md), then the room distance.
const loadImg = src => new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; });
const REFS = {front: [320, 400, 560, 500], q34: [290, 20, 590, 270], side: [440, 190, 460, 270], back: [400, 60, 380, 400]};   // x, y, w, h
const refs = {}; for (const k in REFS) refs[k] = await loadImg(`./ref/${k}.jpg`);
const S = 480, sheet = document.createElement("canvas"); sheet.width = S * 4; sheet.height = S * 3;
const g = sheet.getContext("2d"); g.fillStyle = "#8c8c8c"; g.fillRect(0, 0, sheet.width, sheet.height);
function photo(k, x, y){
  const im = refs[k]; if (!im) return;
  const [sx, sy, sw, sh] = REFS[k], f = Math.min(S / sw, S / sh), w = sw * f, h = sh * f;
  g.drawImage(im, sx, sy, sw, sh, x + (S - w) / 2, y + (S - h) / 2, w, h);
}
const views = [["front", 0, 6], ["q34", 38, 8], ["side", 90, 6], ["back", 180, 8]];
let closeCam = null;
views.forEach(([k, az, el], i) => {
  const x = (i % 2) * 2 * S, y = Math.floor(i / 2) * S, r = shot(az, el, 0.5, 30, S, S, false);
  g.drawImage(r.c, x, y); photo(k, x + S, y); if (i === 1) closeCam = r.cam;
});
const far = shot(18, 4, 2.2, 30, 1280, 800, true);             // room.html's lens at 2.2 m, the LOD
g.drawImage(far.c, 640 - 200, 400 - 200, 400, 400, 40, 2 * S + 40, 400, 400);    // the head at 1:1 pixels
g.drawImage(far.c, 0, 0, 1280, 800, S + 120, 2 * S + 15, 720, 450);              // the whole frame

const stats = {...grown.stats, ribbonVerts: full.geometry.attributes.position.count, ribbonTris: full.geometry.index.count / 3,
  lodTris: lod.geometry.drawRange.count / 3, msGrow,
  msDrawFull_close480: timeDraw(closeCam, false, S, S), msDrawLod_room1280x800: timeDraw(far.cam, true, 1280, 800),
  msDrawFull_room1280x800: timeDraw(far.cam, false, 1280, 800)};
const b64 = buf => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
window.OUT = {sheet: sheet.toDataURL("image/png").split(",")[1], glb: b64(glb), scalp: scalpCanvas.toDataURL("image/png").split(",")[1], stats};
</script></body></html>
