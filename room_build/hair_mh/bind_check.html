<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
<script type="module">
// The hair bound to the dressed G2 in its clips: hair_mh parented to the "Head" bone (position 0), the clothes'
// corrective shapes driven each frame, every DT seconds of each clip it counts
//   - hair points inside the skin: the closest point on the body's triangles near the head, behind that triangle by
//     more than 1 mm (the root of each hair left out);
//   - hair segments crossing the hoodie's triangles (skinned as three.js does) near the neck and shoulders;
// with the collar collider applied exactly as hair_strands.js's vertex shader does (or ?collar=0 for without).
// Files next to it: boy_g2_dressed.glb, hair_mh.glb (with its collar map), <clip>.glb from clips_g2.
//   ?clips=room_read,room_drink&dt=0.25&collar=1 -> window.OUT
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const Q = new URLSearchParams(location.search), DT = +(Q.get("dt") || 0.25), CLIPS = (Q.get("clips") || "room_read,room_drink").split(","), USE_COLLAR = Q.get("collar") !== "0";
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const [dressed, hairG, ...clipG] = await Promise.all(["boy_g2_dressed.glb", "hair_mh.glb", ...CLIPS.map(c => c + ".glb")].map(f => loader.loadAsync("./" + f)));
const root = dressed.scene, CORR = (dressed.parser.json.extras || {}).correctives;
const head = root.getObjectByName("Head"), spine = root.getObjectByName("Spine"), hair = hairG.scene.getObjectByName("hair_mh"), MAP = hair.userData.collar;
hair.position.set(0, 0, 0); head.add(hair);
let lines = null; hair.traverse(o => { if (o.isLineSegments) lines = o; });
const LP = lines.geometry.attributes.position, LI = lines.geometry.index.array, LC = lines.geometry.attributes.color, np = LP.count;
const local = new Float32Array(np * 3), tAlong = new Float32Array(np), hairId = new Int32Array(np).fill(-1);
for (let i = 0; i < np; i++){ local[i*3] = LP.getX(i); local[i*3+1] = LP.getY(i); local[i*3+2] = LP.getZ(i); tAlong[i] = LC.getX(i); }
{ const isRoot = new Uint8Array(np).fill(1); for (let k = 0; k < LI.length; k += 2) isRoot[LI[k+1]] = 0;
  let h = 0; for (let i = 0; i < np; i++) if (isRoot[i]) hairId[i] = h++;
  for (let k = 0; k < LI.length; k += 2) if (hairId[LI[k+1]] < 0) hairId[LI[k+1]] = hairId[LI[k]]; }   // each hair's segments run root to tip
const mixer = new THREE.AnimationMixer(root);
function applyCorrectives(){ // as the clothes' README says the room page does
  if (!CORR) return;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const p = n => { const v = new THREE.Vector3(); root.getObjectByName(n).getWorldPosition(v); return v; };
  const down = p("Hips").sub(p("neck")).normalize(), deg = (a, b) => THREE.MathUtils.radToDeg(a.angleTo(b)), w = {};
  for (const [name, d] of Object.entries(CORR.drivers)){
    let v = 0;
    if (d.type === "hip_bend") v = (deg(p("LeftLeg").sub(p("LeftUpLeg")), down) + deg(p("RightLeg").sub(p("RightUpLeg")), down)) / 2;
    else if (d.type === "elbow_bend") v = deg(p(d.side + "ForeArm").sub(p(d.side + "Arm")), p(d.side + "Hand").sub(p(d.side + "ForeArm")));
    else if (d.type === "chest_up"){ const f = new THREE.Vector3().crossVectors(p("LeftArm").sub(p("RightArm")), down.clone().negate()).normalize(); v = f.y; }
    w[name] = smooth(d.from, d.to, v);
  }
  root.traverse(o => { if (o.isMesh && o.morphTargetDictionary) for (const [nm, i] of Object.entries(o.morphTargetDictionary)) o.morphTargetInfluences[i] = w[nm] || 0; });
}
const skinned = []; root.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
const body = skinned.find(o => /body/i.test(o.parent.name) || /body/i.test(o.name)), hood = skinned.filter(o => /hoodie/i.test(o.name) || /hoodie/i.test(o.parent.name));
root.updateMatrixWorld(true);
const v3 = new THREE.Vector3(), hj = new THREE.Vector3(); head.getWorldPosition(hj);
const BI = body.geometry.index.array, near = new Uint8Array(body.geometry.attributes.position.count), headTris = [];
{ const bp = body.geometry.attributes.position; for (let i = 0; i < bp.count; i++){ v3.fromBufferAttribute(bp, i).applyMatrix4(body.matrixWorld); near[i] = v3.distanceTo(hj) < 0.28 ? 1 : 0; } }
for (let t = 0; t < BI.length / 3; t++) if (near[BI[t*3]] || near[BI[t*3+1]] || near[BI[t*3+2]]) headTris.push(t);
function allPositions(mesh){ const n = mesh.geometry.attributes.position.count, out = new Float32Array(n * 3);
  for (let i = 0; i < n; i++){ mesh.getVertexPosition(i, v3); v3.applyMatrix4(mesh.matrixWorld); out[i*3] = v3.x; out[i*3+1] = v3.y; out[i*3+2] = v3.z; } return out; }
const cellKey = (x, y, z) => (x + 512) * 1048576 + (y + 512) * 1024 + (z + 512), key = (x, y, z, c) => cellKey(Math.floor(x / c), Math.floor(y / c), Math.floor(z / c));
const hw = new Float32Array(np * 3);
function hairWorld(){ lines.updateMatrixWorld(true); const e = lines.matrixWorld.elements;
  for (let i = 0; i < np; i++){ const x = local[i*3], y = local[i*3+1], z = local[i*3+2];
    hw[i*3] = e[0]*x + e[4]*y + e[8]*z + e[12]; hw[i*3+1] = e[1]*x + e[5]*y + e[9]*z + e[13]; hw[i*3+2] = e[2]*x + e[6]*y + e[10]*z + e[14]; } }
// the collar, as in hair_strands.js's vertex shader
function collar(){
  let pushed = 0, maxMm = 0; if (!USE_COLLAR || !MAP) return {pushed, maxMm};
  const m = MAP, inv = new THREE.Matrix4().copy(spine.matrixWorld).invert(), M = spine.matrixWorld, q = new THREE.Vector3();
  const at = (arr, gx, gy) => { if (gx < 0 || gy < 0 || gx >= m.nx - 1 || gy >= m.ny - 1) return 99; const cx = Math.floor(gx), cy = Math.floor(gy), u = gx - cx, v = gy - cy;
    const Z = j => arr[j] === m.none ? 99 : arr[j] / 1000, A = Z(cy*m.nx+cx), B = Z(cy*m.nx+cx+1), E = Z((cy+1)*m.nx+cx), F = Z((cy+1)*m.nx+cx+1);
    return Math.max(A, B, E, F) > 9 ? 99 : (A*(1-u) + B*u)*(1-v) + (E*(1-u) + F*u)*v; };
  for (let i = 0; i < np; i++){ q.set(hw[i*3], hw[i*3+1], hw[i*3+2]).applyMatrix4(inv); let moved = 0;
    const zb = at(m.zmm, (q.x - m.x0) / m.cell, (q.y - m.y0) / m.cell);
    if (zb < 9){ const over = q.z - (zb - m.pad); if (over > 0 && over < m.depth){ q.z = zb - m.pad; moved += over; } }
    const yt = at(m.ymm, (q.x - m.x0) / m.cell, (q.z - m.z0) / m.cell);
    if (yt < 9){ const under = yt + m.padTop - q.y; if (under > 0 && under < m.depthTop){ q.y = yt + m.padTop; moved += under; } }
    if (!moved) continue; q.applyMatrix4(M); hw[i*3] = q.x; hw[i*3+1] = q.y; hw[i*3+2] = q.z; pushed++; maxMm = Math.max(maxMm, moved * 1000); }
  return {pushed, maxMm: +maxMm.toFixed(1)};
}
function segTri(p, q, a, b, c){ // Möller-Trumbore, the segment p-q against the triangle a-b-c
  const ex = b[0]-a[0], ey = b[1]-a[1], ez = b[2]-a[2], fx = c[0]-a[0], fy = c[1]-a[1], fz = c[2]-a[2], dx = q[0]-p[0], dy = q[1]-p[1], dz = q[2]-p[2];
  const hx = dy*fz - dz*fy, hy = dz*fx - dx*fz, hz = dx*fy - dy*fx, det = ex*hx + ey*hy + ez*hz; if (Math.abs(det) < 1e-14) return false;
  const inv = 1 / det, sx = p[0]-a[0], sy = p[1]-a[1], sz = p[2]-a[2], u = (sx*hx + sy*hy + sz*hz) * inv; if (u < 0 || u > 1) return false;
  const qx = sy*ez - sz*ey, qy = sz*ex - sx*ez, qz = sx*ey - sy*ex, v = (dx*qx + dy*qy + dz*qz) * inv; if (v < 0 || u + v > 1) return false;
  const t = (fx*qx + fy*qy + fz*qz) * inv; return t >= 0 && t <= 1; }
function measure(){
  root.updateMatrixWorld(true); applyCorrectives(); hairWorld(); const col = collar(); head.getWorldPosition(hj);
  // skin
  const bpos = allPositions(body), C = 0.01, grid = new Map(), tr = new THREE.Triangle(), cp = new THREE.Vector3(), pp = new THREE.Vector3(), fn = new THREE.Vector3();
  for (const t of headTris){ const ia = BI[t*3]*3, ib = BI[t*3+1]*3, ic = BI[t*3+2]*3;
    const lo = [0,1,2].map(d => Math.floor((Math.min(bpos[ia+d], bpos[ib+d], bpos[ic+d]) - 0.006) / C)), hi = [0,1,2].map(d => Math.floor((Math.max(bpos[ia+d], bpos[ib+d], bpos[ic+d]) + 0.006) / C));
    for (let x = lo[0]; x <= hi[0]; x++) for (let y = lo[1]; y <= hi[1]; y++) for (let z = lo[2]; z <= hi[2]; z++){ const k = cellKey(x, y, z); let L = grid.get(k); if (!L) grid.set(k, L = []); L.push(t); } }
  const inHairs = new Set(); let inPts = 0;
  for (let i = 0; i < np; i++){ if (tAlong[i] < 0.05) continue; pp.set(hw[i*3], hw[i*3+1], hw[i*3+2]);
    const L = grid.get(key(pp.x, pp.y, pp.z, C)); if (!L) continue; let bd = Infinity, bx = 0, by = 0, bz = 0;
    for (const t of L){ const ia = BI[t*3]*3, ib = BI[t*3+1]*3, ic = BI[t*3+2]*3; tr.a.set(bpos[ia], bpos[ia+1], bpos[ia+2]); tr.b.set(bpos[ib], bpos[ib+1], bpos[ib+2]); tr.c.set(bpos[ic], bpos[ic+1], bpos[ic+2]);
      tr.closestPointToPoint(pp, cp); const d = cp.distanceToSquared(pp); if (d < bd){ bd = d; bx = cp.x; by = cp.y; bz = cp.z; tr.getNormal(fn); } }
    if (bd > 0.006 * 0.006) continue;
    if ((pp.x - bx) * fn.x + (pp.y - by) * fn.y + (pp.z - bz) * fn.z < -0.001){ inPts++; inHairs.add(hairId[i]); } }
  // hoodie
  const C2 = 0.02, tg = new Map(), tris = [], crossHairs = new Set(); let cross = 0;
  for (const m of hood){ const pos = allPositions(m), I = m.geometry.index.array;
    for (let k = 0; k < I.length; k += 3){ const a = I[k]*3, b = I[k+1]*3, c = I[k+2]*3;
      if (Math.max(pos[a+1], pos[b+1], pos[c+1]) < hj.y - 0.3) continue;
      const T = [[pos[a], pos[a+1], pos[a+2]], [pos[b], pos[b+1], pos[b+2]], [pos[c], pos[c+1], pos[c+2]]], ti = tris.push(T) - 1;
      const lo = [0,1,2].map(d => Math.floor(Math.min(T[0][d], T[1][d], T[2][d]) / C2)), hi = [0,1,2].map(d => Math.floor(Math.max(T[0][d], T[1][d], T[2][d]) / C2));
      for (let x = lo[0]; x <= hi[0]; x++) for (let y = lo[1]; y <= hi[1]; y++) for (let z = lo[2]; z <= hi[2]; z++){ const kk = cellKey(x, y, z); let L = tg.get(kk); if (!L) tg.set(kk, L = []); L.push(ti); } } }
  for (let k = 0; k < LI.length; k += 2){ const a = LI[k]*3, b = LI[k+1]*3, p = [hw[a], hw[a+1], hw[a+2]], q = [hw[b], hw[b+1], hw[b+2]];
    const cand = new Set(); for (const P of [p, q]){ const L = tg.get(key(P[0], P[1], P[2], C2)); if (L) for (const t of L) cand.add(t); }
    for (const t of cand){ const T = tris[t]; if (segTri(p, q, T[0], T[1], T[2])){ cross++; crossHairs.add(hairId[LI[k]]); break; } } }
  return {pushed: col.pushed, pushMaxMm: col.maxMm, inPts, inHairs: inHairs.size, cross, crossHairs: crossHairs.size};
}
const OUT = {hairs: hairId.reduce((a, x) => Math.max(a, x), 0) + 1, points: np, collar: USE_COLLAR && !!MAP, dt: DT, clips: {}};
for (const g of clipG){
  const clip = g.animations[0], act = mixer.clipAction(clip); mixer.stopAllAction(); act.play();
  const rows = []; let n = 0;
  for (let t = 0; t <= clip.duration + 1e-6; t += DT){ mixer.setTime(t); const r = measure(); n++; if (r.inPts || r.cross || r.pushed) rows.push({t: +t.toFixed(2), ...r}); }
  act.stop();
  const mx = k => rows.reduce((a, r) => Math.max(a, r[k]), 0);
  OUT.clips[clip.name] = {duration: +clip.duration.toFixed(2), frames: n, maxHairsInSkin: mx("inHairs"), maxHairsThroughHoodie: mx("crossHairs"),
    framesWithCollarPush: rows.filter(r => r.pushed).length, maxPointsPushed: mx("pushed"), maxPushMm: mx("pushMaxMm"), rows};
  console.log(clip.name, JSON.stringify({...OUT.clips[clip.name], rows: rows.length}));
}
window.OUT = OUT;
</script></body></html>
