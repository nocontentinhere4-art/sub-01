<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w')||800), H = +(q.get('h')||560);
const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
r.setSize(W,H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#2a2a2e');
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity = 0.8;
const key = new THREE.DirectionalLight(0xffffff, 1.4); scene.add(key);
const cam = new THREE.PerspectiveCamera(30, W/H, 0.01, 100);
const L = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const g = await L.loadAsync('/model.glb'), c = await L.loadAsync('/clip.glb');
const root = g.scene; scene.add(root);
const hide = q.get('hide') !== '0';
let body = null;
root.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (/slide/.test(o.name)) o.visible = !hide; else if (o.isSkinnedMesh && (!body || o.geometry.attributes.position.count > body.geometry.attributes.position.count)) body = o; } });
const clip = c.animations[0], mixer = new THREE.AnimationMixer(root);
mixer.clipAction(clip).play(); mixer.setTime(clip.duration - 0.02); root.updateMatrixWorld(true);
// posed body: lowest point (the mattress top) and the body's long axis
const v = new THREE.Vector3(), pts = []; const n = body.geometry.attributes.position.count;
for (let i = 0; i < n; i += 7) { body.getVertexPosition(i, v); pts.push(v.clone().applyMatrix4(body.matrixWorld)); }
const wp = nm => root.getObjectByName(nm).getWorldPosition(new THREE.Vector3());
const head = wp('Head'), F = wp('L_Foot').add(wp('R_Foot')).multiplyScalar(0.5);
const ax = F.clone().sub(head).setY(0).normalize(), side = new THREE.Vector3(-ax.z, 0, ax.x);
// the mattress top: the 2nd percentile height of the torso/legs' back (he sinks a little into it)
const ys = pts.map(p => p.y).sort((a, b) => a - b); const top = ys[Math.floor(ys.length * 0.02)] + 0.008;
const mid = head.clone().add(F).multiplyScalar(0.5);
const len = 2.0, wid = 1.2, th = 0.25;
const mat = new THREE.Mesh(new THREE.BoxGeometry(len, th, wid), new THREE.MeshStandardMaterial({color: '#c9ccd4', roughness: 0.95}));
const foot_end = F.clone().add(ax.clone().multiplyScalar(0.15));
const centre = foot_end.clone().sub(ax.clone().multiplyScalar(len / 2));
mat.position.set(centre.x, top - th / 2, centre.z); mat.rotation.y = -Math.atan2(ax.z, ax.x); scene.add(mat);
window.info = {top, head: head.toArray(), feet: F.toArray(), ax: ax.toArray(), clip: [clip.name, clip.duration]};
const P = (base, a, s, y) => base.clone().add(ax.clone().multiplyScalar(a)).add(side.clone().multiplyScalar(s)).setY(top + y);
const cams = {
  foot_end:       [P(F, 1.3, 0.0, 0.45), P(F, -0.55, 0, 0.12), 32],
  foot_end_close: [P(F, 1.05, 0.10, 0.30), P(F, -0.12, 0, 0.10), 30],
  low_side:       [P(F, -0.1, 1.15, 0.10), P(F, -0.45, 0, 0.10), 34],
  low_side_close: [P(F, 0.35, 0.80, 0.07), P(F, -0.10, 0, 0.08), 30],
};
window.shot = (name) => {
  const [p, t, fov] = cams[name];
  key.position.copy(p).add(new THREE.Vector3(0.5, 2.5, 0.8));
  cam.fov = fov; cam.updateProjectionMatrix(); cam.position.copy(p); cam.lookAt(t);
  r.render(scene, cam); return true;
};
window.shotRel = (bone, a, sd, y, ta, ts, ty, fov) => { const B = wp(bone);
  const p = B.clone().add(ax.clone().multiplyScalar(a)).add(side.clone().multiplyScalar(sd)); p.y = B.y + y;
  const t = B.clone().add(ax.clone().multiplyScalar(ta)).add(side.clone().multiplyScalar(ts)); t.y = B.y + ty;
  key.position.copy(p).add(new THREE.Vector3(0.5, 2.5, 0.8)); cam.fov = fov; cam.updateProjectionMatrix(); cam.position.copy(p); cam.lookAt(t); r.render(scene, cam); return true; };
window.pick = (name, px, py) => { shot(name); const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2(px / W * 2 - 1, -(py / H * 2 - 1)), cam);
  const h = rc.intersectObjects(scene.children, true).filter(x => x.object.visible)[0]; if (!h) return null; const o = h.object; const f = h.face;
  const g = o.geometry; o.skeleton.pose(); root.updateMatrixWorld(true); const v = new THREE.Vector3();
  const rest = [f.a, f.b, f.c].map(i => { o.getVertexPosition(i, v); return v.clone().applyMatrix4(o.matrixWorld).toArray().map(x => +x.toFixed(4)); });
  const sk = g.attributes.skinIndex, sw = g.attributes.skinWeight; const wts = [0,1,2,3].map(k => [o.skeleton.bones[sk.getComponent(f.a,k)].name, +sw.getComponent(f.a,k).toFixed(2)]);
  mixer.setTime(clip.duration - 0.02); root.updateMatrixWorld(true); const pa = g.attributes.position; return [o.name, h.faceIndex, [f.a, f.b, f.c].map(i => [i, +pa.getX(i).toFixed(4), +pa.getY(i).toFixed(4), +pa.getZ(i).toFixed(4)]), wts]; };
window.dbg2 = () => { const o = body, g = o.geometry, pa = g.attributes.position, ix = g.index.array, a = new THREE.Vector3(), b = new THREE.Vector3();
  const pos = new Float32Array(pa.count * 3); for (let i = 0; i < pa.count; i++) { o.getVertexPosition(i, a); a.toArray(pos, 3 * i); }
  const rs = []; for (let t = 0; t < ix.length; t += 3) { let m = 0, m0 = 0; for (let k = 0; k < 3; k++) { const i = ix[t + k], j = ix[t + (k + 1) % 3];
    a.fromArray(pos, 3 * i); b.fromArray(pos, 3 * j); m = Math.max(m, a.distanceTo(b)); a.fromBufferAttribute(pa, i); b.fromBufferAttribute(pa, j); m0 = Math.max(m0, a.distanceTo(b)); } rs.push(m / (m0 + 1e-9)); }
  const med = [...rs].sort((x, y) => x - y)[rs.length >> 1]; const out = []; rs.forEach((r, t) => { if (r > 2.2 * med) out.push([t, +(r / med).toFixed(2)]); });
  out.sort((x, y) => y[1] - x[1]); return [ix.length / 3, med, out.length, out.slice(0, 40)]; };
window.dbg = () => { const out=[]; root.traverse(o=>{ if(!o.isSkinnedMesh) return; const g=o.geometry, pa=g.attributes.position, ix=g.index.array, a=new THREE.Vector3(), b=new THREE.Vector3(), c=new THREE.Vector3();
  const pos=new Float32Array(pa.count*3); for(let i=0;i<pa.count;i++){o.getVertexPosition(i,a); a.toArray(pos,3*i);}
  const r=[]; for(let t=0;t<ix.length;t+=3){ let m=0, m0=0; for(let k=0;k<3;k++){const i=ix[t+k], j=ix[t+(k+1)%3]; a.fromArray(pos,3*i); b.fromArray(pos,3*j); m=Math.max(m,a.distanceTo(b)); a.fromBufferAttribute(pa,i); b.fromBufferAttribute(pa,j); m0=Math.max(m0,a.distanceTo(b));} r.push([m/(m0+1e-9),t/3,m,m0]); }
  r.sort((x,y)=>y[0]-x[0]); out.push([o.name, pa.count, r.slice(0,6), r.slice(0,3).map(x=>{const i=ix[3*x[1]]; const sk=g.attributes.skinIndex, sw=g.attributes.skinWeight; return [i,[0,1,2,3].map(k=>[o.skeleton.bones[sk.getComponent(i,k)].name, +sw.getComponent(i,k).toFixed(2)]), [pa.getX(i),pa.getY(i),pa.getZ(i)]];})]); }); return out; };
window.ready = true;
</script></body></html>
