<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#d9dde2}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const W = 480, H = 480;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd9dde2);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667080, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 3, 2); scene.add(sun);
const camera = new THREE.PerspectiveCamera(28, W / H, 0.05, 50);
let gltf, mixer, actions = {}, plane;
window.load = async (url) => {
  const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
  gltf = await L.loadAsync(url); scene.add(gltf.scene);
  gltf.scene.traverse(o => { if (o.isMesh) { o.frustumCulled = false; } });
  mixer = new THREE.AnimationMixer(gltf.scene);
  for (const a of gltf.animations) actions[a.name] = mixer.clipAction(a);
  return gltf.animations.map(a => [a.name, a.duration]);
};
window.setPlane = (y, cx, cz, sx, sz) => {
  if (plane) scene.remove(plane);
  if (y === null) return;
  plane = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.002, sz), new THREE.MeshBasicMaterial({color: 0x7a5c3a, transparent: true, opacity: 0.35, depthWrite: false}));
  plane.position.set(cx, y - 0.001, cz); scene.add(plane);
};
const V = () => new THREE.Vector3();
window.pose = (name, t) => {
  for (const a of Object.values(actions)) a.stop();
  const a = actions[name]; a.play(); mixer.setTime(t); gltf.scene.updateMatrixWorld(true);
};
window.bones = (names) => names.map(n => gltf.scene.getObjectByName(n).getWorldPosition(V()).toArray());
window.shot = (target, dir, dist) => {   // dir: unit vector from target to camera
  const tg = V().fromArray(target), d = V().fromArray(dir).normalize();
  camera.position.copy(tg).addScaledVector(d, dist);
  camera.up.set(0, 1, 0); if (Math.abs(d.y) > 0.95) camera.up.set(0, 0, -1);
  camera.lookAt(tg); renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/jpeg", 0.85);
};
let rest = {};
window.basis = (name, n) => {   // chest forward / his left, averaged over the clip (T-pose rest: forward +Z, left +X)
  const sp = gltf.scene.getObjectByName("mixamorigSpine2");
  if (!rest.q) { for (const a of Object.values(actions)) a.stop(); mixer.setTime(0); gltf.scene.updateMatrixWorld(true); rest.q = sp.getWorldQuaternion(new THREE.Quaternion()); }
  const f = V(), l = V(), dur = actions[name].getClip().duration;
  for (let i = 0; i < n; i++) { pose(name, dur * (i + 0.5) / n); const q = sp.getWorldQuaternion(new THREE.Quaternion()).multiply(rest.q.clone().invert());
    f.add(V().set(0, 0, 1).applyQuaternion(q)); l.add(V().set(1, 0, 0).applyQuaternion(q)); }
  return [f.normalize().toArray(), l.normalize().toArray()];
};
window.wtr = (names) => names.map(n => { const o = gltf.scene.getObjectByName(n); return [o.getWorldPosition(V()).toArray(), o.getWorldQuaternion(new THREE.Quaternion()).toArray()]; });
window.ready = true;
</script></body></html>
